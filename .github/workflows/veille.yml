name: Veille

# Une fois par jour, sans rien pousser : le seul morceau de l'application
# qui ne nous appartient pas peut changer sans nous prévenir.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  tiers:
    name: Le script tiers n'a pas bougé
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Comparer l'empreinte
        run: python3 src/tiers.py index.html

  formulaire:
    name: Le formulaire des impôts n'a pas été republié
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Il est republié chaque printemps. L'application continuerait à remplir
      # celui de l'an dernier, avec les bons chiffres et dans les bonnes cases,
      # donc sans que rien ne le signale. On veut l'apprendre en mars, pas en
      # avril chez le comptable.
      - name: Comparer à l'empreinte relevée
        run: python3 src/formulaire.py

  page:
    name: La page publiée répond
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Interroger l'adresse publique
        run: |
          code=$(curl -sS -o /tmp/enligne.html -w "%{http_code}" https://sachadobek-lang.github.io/)
          echo "réponse : $code"
          if [ "$code" != "200" ]; then
            echo "::error::La page publiée répond $code au lieu de 200."
            exit 1
          fi
          if ! grep -q "Content-Security-Policy" /tmp/enligne.html; then
            echo "::error::La page en ligne n'a pas de politique de sécurité : elle est périmée."
            exit 1
          fi
          for fichier in manifest.webmanifest sw.js icone.svg 404.html robots.txt; do
            c=$(curl -sS -o /dev/null -w "%{http_code}" "https://sachadobek-lang.github.io/$fichier")
            echo "$fichier : $c"
            if [ "$c" != "200" ]; then
              echo "::error::$fichier répond $c : l'ouverture sans réseau ne fonctionnera pas."
              exit 1
            fi
          done
          echo "La page en ligne répond, porte ses protections, et peut s'ouvrir sans réseau."
