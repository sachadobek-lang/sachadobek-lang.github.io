<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadence</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Outfit:wght@500;600;700;800&display=swap">
<style>
:root{
  --ground:#EFF3F8; --surface:#FFFFFF; --surface-2:#F5F8FC; --surface-3:#E9EFF6;
  --line:#DFE7F0; --line-fort:#C6D2E0;
  --ink:#14202E; --ink-2:#4F5B70; --ink-3:#7F8CA1;

  /* la signature : un seul dégradé vert → bleu, partout */
  --v1:#0B7D6E; --v2:#17539F;
  --deg:linear-gradient(135deg,#0B7D6E 0%,#17539F 100%);
  --deg-fonce:linear-gradient(140deg,#075C52 0%,#0F3C78 100%);
  --deg-pale:linear-gradient(135deg,#E2F2EF 0%,#E4ECFA 100%);
  --fond:linear-gradient(165deg,#9CDDCB 0%,#A9CEF6 100%);
  --tuile-neutre:linear-gradient(150deg,#FFFFFF 0%,#F1F7FF 100%);
  --tuile-vert:linear-gradient(150deg,#E9F9F1 0%,#D5EFE4 100%);
  --tuile-chaud:linear-gradient(150deg,#FEF5E8 0%,#FAE8CC 100%);

  /* sémantique : trois états, jamais plus */
  --ok:#0E7D57; --ok-doux:#DDF1E8;
  --tard:#A3670F; --tard-doux:#FBEDD6;
  --attente:#1D5BA8; --attente-doux:#E3ECFB;
  --sur-plein:#FFFFFF;

  --rxl:32px; --rl:26px; --rm:20px; --rs:14px;
  --o1:0 1px 2px rgba(20,32,46,.04), 0 12px 32px -20px rgba(20,32,46,.28);
  --o2:0 14px 38px -16px rgba(11,70,110,.42);
  --o3:0 18px 46px -14px rgba(20,32,46,.30);
  --ui:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --num:"Outfit","Nunito",-apple-system,sans-serif;
  --ressort:cubic-bezier(.34,1.46,.44,1);
  --doux:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#080E16; --surface:#131C28; --surface-2:#1A2431; --surface-3:#101924;
    --line:#233040; --line-fort:#334152;
    --ink:#ECF2F9; --ink-2:#A2AFC2; --ink-3:#73819A;
    --deg:linear-gradient(135deg,#17A794 0%,#3B82E0 100%);
    --deg-fonce:linear-gradient(140deg,#0A6B5F 0%,#144B92 100%);
    --deg-pale:linear-gradient(135deg,#0F2A27 0%,#12233C 100%);
    --fond:linear-gradient(165deg,#062421 0%,#081730 100%);
    --tuile-neutre:linear-gradient(150deg,#16202E 0%,#131C2B 100%);
    --tuile-vert:linear-gradient(150deg,#0E2C22 0%,#0B2419 100%);
    --tuile-chaud:linear-gradient(150deg,#2B2214 0%,#241B0F 100%);
    --ok:#3FC391; --ok-doux:#0C2A20;
    --tard:#DFA850; --tard-doux:#2A2113;
    --attente:#74A8F0; --attente-doux:#142740;
    --sur-plein:#FFFFFF;
    --o1:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.8);
    --o2:0 14px 38px -16px rgba(0,0,0,.8);
    --o3:0 18px 46px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#080E16; --surface:#131C28; --surface-2:#1A2431; --surface-3:#101924;
  --line:#233040; --line-fort:#334152;
  --ink:#ECF2F9; --ink-2:#A2AFC2; --ink-3:#73819A;
  --deg:linear-gradient(135deg,#17A794 0%,#3B82E0 100%);
  --deg-fonce:linear-gradient(140deg,#0A6B5F 0%,#144B92 100%);
  --deg-pale:linear-gradient(135deg,#0F2A27 0%,#12233C 100%);
  --fond:linear-gradient(165deg,#062421 0%,#081730 100%);
  --tuile-neutre:linear-gradient(150deg,#16202E 0%,#131C2B 100%);
  --tuile-vert:linear-gradient(150deg,#0E2C22 0%,#0B2419 100%);
  --tuile-chaud:linear-gradient(150deg,#2B2214 0%,#241B0F 100%);
  --ok:#3FC391; --ok-doux:#0C2A20;
  --tard:#DFA850; --tard-doux:#2A2113;
  --attente:#74A8F0; --attente-doux:#142740;
  --sur-plein:#FFFFFF;
  --o1:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.8);
  --o2:0 14px 38px -16px rgba(0,0,0,.8);
  --o3:0 18px 46px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{margin:0;background:var(--fond) fixed;color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--v1);outline-offset:3px;border-radius:10px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

.page{max-width:820px;width:100%;margin:0 auto;padding:26px 16px 156px;display:flex;flex-direction:column;gap:20px;position:relative}
@media(min-width:560px){ .page{padding:34px 26px 160px} }


.entete{display:flex;align-items:center;gap:14px;padding:2px 4px}
.entete .bonjour{font-family:var(--num);font-weight:600;font-size:clamp(26px,6vw,34px);letter-spacing:-.02em;line-height:1.1}
.entete .quand{font-size:14px;color:var(--ink-3);margin-top:2px}
.serie{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);padding:9px 15px 9px 12px;border-radius:999px;box-shadow:var(--o1);white-space:nowrap}
.serie svg{width:17px;height:17px;flex:none;color:var(--ink-3)}
.serie b{font-family:var(--num);font-weight:600;font-size:16px}
.serie span{font-size:13px;color:var(--ink-3)}
.serie.active{border-color:transparent;background:var(--deg);color:#fff}
.serie.active svg{color:#fff}
.serie.active span{color:rgba(255,255,255,.85)}

/* ═══ cartes ═══ */
.carte{background:var(--surface);border-radius:var(--rl);box-shadow:var(--o1);overflow:hidden}
.carte-tete{display:flex;align-items:center;gap:12px;padding:24px 24px 16px}
.carte-tete h2{font-family:var(--num);font-weight:600;font-size:19px;letter-spacing:-.015em}
.carte-tete .appoint{margin-left:auto;font-size:14px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.vide{padding:30px 22px 34px;text-align:center;color:var(--ink-3);font-size:15px}
.vide b{display:block;color:var(--ink-2);font-family:var(--num);font-weight:600;font-size:18px;margin-bottom:6px}

/* ═══ la carte du jour ═══ */
.heros{border-radius:var(--rxl);background:var(--deg-fonce);box-shadow:var(--o2);overflow:hidden;padding:5px}
.jour{display:flex;gap:26px;align-items:center;padding:36px 30px 38px;color:#fff}
.jour h2{font-family:var(--num);font-weight:600;font-size:clamp(26px,5.6vw,34px);letter-spacing:-.025em;line-height:1.1}
.anneau{width:124px;height:124px;flex:none;position:relative}
.anneau svg{width:100%;height:100%;transform:rotate(-90deg)}
.anneau circle{fill:none;stroke-width:11;stroke-linecap:round}
.anneau .piste{stroke:rgba(255,255,255,.2)}
.anneau .jauge{stroke:#fff;stroke-dasharray:289.03;transition:stroke-dashoffset 1.1s var(--doux)}
.anneau .milieu{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.anneau .milieu b{font-family:var(--num);font-weight:600;font-size:38px;letter-spacing:-.03em;display:block;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
.anneau .milieu em{display:block;font-style:normal;font-family:var(--ui);font-size:14px;font-weight:700;color:rgba(255,255,255,.75);margin-top:4px}
.anneau .milieu span{display:none}
.jour-txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.jour-txt h2{font-family:var(--num);font-weight:600;font-size:23px;letter-spacing:-.02em}
.jour-txt p{font-size:15.5px;color:rgba(255,255,255,.82)}
.jour-txt .rappel{color:#FFD79A;font-weight:700}
.liste-jour{background:var(--surface);border-radius:calc(var(--rxl) - 7px);padding:4px 0}
.fini{display:flex;flex-direction:column;align-items:center;gap:6px;padding:44px 24px 46px;text-align:center;color:#fff}
.coche-geante{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-content:center;animation:pop .55s var(--ressort) both}
.coche-geante svg{width:36px;height:36px;stroke:#fff;stroke-width:3.2;fill:none}
.fini h2{font-family:var(--num);font-weight:600;font-size:28px;letter-spacing:-.02em;margin-top:16px}
.fini p{font-size:15.5px;color:rgba(255,255,255,.82);max-width:34ch}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* ═══ l'argent ═══ */
.mois{padding:2px 22px 22px}
.heros-val{font-family:var(--num);font-weight:600;font-size:clamp(36px,9vw,48px);letter-spacing:-.03em;line-height:1.08;font-variant-numeric:tabular-nums}
.heros-lab{font-size:14px;font-weight:600;color:var(--ink-3)}
.heros-delta{display:inline-flex;align-items:center;gap:6px;margin-top:11px;font-size:14px;font-weight:700;padding:6px 14px 6px 10px;border-radius:999px}
.heros-delta svg{width:14px;height:14px}
.heros-delta.haut{color:var(--ok);background:var(--ok-doux)}
.heros-delta.bas{color:var(--tard);background:var(--tard-doux)}
/* ═══ interrupteur ═══ */
.bascule{display:flex;align-items:flex-start;gap:12px;cursor:pointer;font-size:14.5px;color:var(--ink-2);margin-top:14px}
.bascule input{appearance:none;width:46px;height:27px;border-radius:999px;background:var(--line);flex:none;
  position:relative;transition:background .22s var(--doux);margin-top:1px}
.bascule input::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:var(--surface);box-shadow:var(--o1);transition:transform .22s var(--ressort)}
.bascule input:checked{background:var(--v1)}
.bascule input:checked::after{transform:translateX(19px)}
.bascule em{font-style:normal;color:var(--ink-3)}

/* ═══ l'objectif ═══ */
.objectif{padding:4px 24px 22px}
.gros-prix{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.gros-prix b{font-family:var(--num);font-weight:600;font-size:34px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gros-prix span{font-size:14.5px;color:var(--ink-3);font-weight:600}
.ou-en{font-size:15px;color:var(--ink-2)}
.ou-en b{font-family:var(--num);font-weight:600;color:var(--ink)}
.atteint{color:var(--ok);font-weight:700}
.risque{display:flex;align-items:center;gap:11px;padding:14px 18px;margin-top:16px;border-radius:var(--rm);
  background:var(--tard-doux);color:var(--tard);font-size:14.5px;font-weight:600}
.risque svg{width:20px;height:20px;flex:none;stroke-width:2.2;fill:none}

/* ═══ les deux seuils à ne pas franchir sans le savoir ═══ */
.seuils{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--rm);overflow:hidden;margin:0 24px 22px}
@media(max-width:439px){ .seuils{grid-template-columns:1fr} }
.seuil{background:var(--surface);padding:17px 19px;display:flex;flex-direction:column;gap:9px}
.seuil .quoi-s{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.seuil .reste-s{font-family:var(--num);font-weight:600;font-size:21px;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.seuil .sous-s{font-size:12.5px;color:var(--ink-3)}
.seuil .piste-s{height:7px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.seuil .piste-s i{display:block;height:100%;border-radius:999px;background:var(--deg)}
.seuil.chaud .reste-s{color:var(--tard)}
.seuil.chaud .piste-s i{background:var(--tard)}
.seuil.franchi .reste-s{color:var(--tard)}

/* ═══ plafond du régime ═══ */
.plafond{padding:2px 24px 22px}
.plafond .piste-p{height:9px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.plafond .piste-p i{display:block;height:100%;border-radius:999px;background:var(--deg);transition:width .8s var(--doux)}
.plafond .piste-p i.chaud{background:var(--tard)}
.plafond .txt{display:flex;justify-content:space-between;gap:12px;margin-top:9px;font-size:13.5px;color:var(--ink-3)}
.plafond .txt b{font-family:var(--num);font-weight:600;color:var(--ink-2)}

/* ═══ bilan ═══ */
.bilan{display:flex;flex-direction:column;margin-top:18px;border-top:2px solid var(--line)}
.bl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15.5px;font-weight:600;color:var(--ink-2)}
.bl b{font-family:var(--num);font-weight:600;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.bl b.plus{color:var(--ok)}
.heros-val.negatif{color:var(--tard)}

/* ═══ tâches ═══ */
.t{display:flex;align-items:flex-start;gap:16px;padding:19px 24px;position:relative;transition:background .15s}
.t + .t::before{content:"";position:absolute;left:64px;right:24px;top:0;height:1px;background:var(--line)}
.t:hover{background:var(--surface-2)}
.coche{appearance:none;width:28px;height:28px;flex:none;margin:0;border:2.5px solid var(--line-fort);border-radius:50%;background:var(--surface);
  display:grid;place-content:center;transition:background .2s var(--doux),border-color .2s var(--doux),transform .2s var(--ressort)}
.coche:hover{border-color:var(--ok);transform:scale(1.12)}
.coche::after{content:"";width:11px;height:6px;border:2.8px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) scale(0);transition:transform .25s var(--ressort);margin-top:-3px}
.coche:checked{background:var(--ok);border-color:var(--ok)}
.coche:checked::after{transform:rotate(-45deg) scale(1)}
.t-corps{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.t-titre{font-size:16.5px;font-weight:600;overflow-wrap:anywhere;transition:color .25s}
[data-modif]{cursor:pointer;border-radius:10px}
[data-modif]:hover .t-titre,[data-modif]:hover .r-titre{color:var(--v1)}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;color:var(--ink-3)}
.t.ok .t-titre{color:var(--ink-3);font-weight:400;text-decoration:line-through}
.sup{opacity:.3;background:none;border:0;color:var(--ink-3);padding:6px 8px;border-radius:10px;font-size:14px;line-height:1;transition:opacity .15s,color .15s,background .15s;flex:none}
.sup .mot{display:none}
.sup::after{content:"\2715";font-size:15px;line-height:1}
.sup[data-arme="1"] .mot{display:inline;font-weight:700;font-size:13.5px}
.sup[data-arme="1"]::after{content:none}
.sup[data-arme="1"]{opacity:1;color:#fff;background:var(--tard)}
.t:hover .sup,.t:focus-within .sup,.r:hover .sup,.r:focus-within .sup,.fiche:hover .sup{opacity:1}
.sup:hover{color:var(--tard);background:var(--tard-doux)}
@media(hover:none){ .sup{opacity:.5} }
.groupe{display:flex;align-items:center;gap:12px;padding:19px 24px;margin-top:18px;
  background:var(--surface-3);border-top:2px solid var(--line);border-bottom:2px solid var(--line);
  font-family:var(--num);font-size:17px;font-weight:600;color:var(--ink)}
.groupe:first-child{margin-top:4px}
.groupe svg{width:22px;height:22px;flex:none;stroke-width:2.1;fill:none;color:var(--ink-2)}
.groupe .nb{margin-left:auto;font-family:var(--ui);font-size:14px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.groupe.chaud{background:var(--tard-doux);border-color:var(--tard);color:var(--tard)}
.groupe.chaud svg,.groupe.chaud .nb{color:var(--tard)}
.groupe + .t::before{display:none}

.etiq{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap}
.etiq.feu{background:var(--tard-doux);color:var(--tard)}
.etiq.ok{background:var(--ok-doux);color:var(--ok)}
.etiq.att{background:var(--surface-3);color:var(--ink-2)}
.etiq.amb{background:var(--attente-doux);color:var(--attente)}
.point{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ═══ tâche créée par l'application ═══ */
.t.auto{background:linear-gradient(90deg,var(--tard-doux),transparent 55%)}
.etiq.robot{background:var(--surface);color:var(--tard);box-shadow:inset 0 0 0 1.5px var(--tard)}
.etiq.robot svg{width:13px;height:13px;stroke-width:2.4;fill:none}

/* ═══ repli d'un groupe ═══ */
details.pli > summary.groupe{cursor:pointer;list-style:none}
details.pli > summary.groupe::-webkit-details-marker{display:none}
summary.groupe .chev{width:9px;height:9px;border-right:2.6px solid var(--ink-3);border-bottom:2.6px solid var(--ink-3);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s var(--doux);flex:none;margin-left:2px}
details.pli[open] > summary.groupe .chev{transform:rotate(-135deg) translate(-3px,-3px)}
summary.groupe:hover{background:var(--line)}

/* ═══ facturer depuis la fiche ═══ */
.action-client{display:flex;gap:10px;flex-wrap:wrap;padding:0 22px 22px}
.action-client button{border:0;border-radius:999px;padding:13px 22px;background:var(--deg);color:#fff;
  font-family:var(--num);font-weight:600;font-size:16px;transition:transform .16s var(--ressort),filter .2s}
.action-client button:hover{filter:brightness(1.08)}
.action-client button:active{transform:scale(.97)}

/* ═══ la piste horaire ═══ */
.agenda{background:var(--surface);border-radius:calc(var(--rxl) - 7px);padding:4px 0 0}
.piste-jour{display:grid;grid-template-columns:52px minmax(0,1fr);position:relative;
  height:var(--h-piste);overflow-y:auto;overscroll-behavior:contain;padding:10px 20px 10px 0}
.piste-jour::-webkit-scrollbar{width:0}
.heures{position:relative}
.heures b{position:absolute;right:12px;transform:translateY(-50%);font-family:var(--num);font-weight:500;
  font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.colonnes{position:relative;display:grid;gap:6px}
.trames{position:absolute;inset:0;pointer-events:none}
.trames i{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.col{position:relative;min-width:0}
.col + .col{border-left:1px solid var(--line)}

.bloc{position:absolute;left:2px;right:2px;border-radius:12px;padding:7px 11px;overflow:hidden;
  background:var(--deg-pale);border-left:3.5px solid var(--v1);cursor:grab;
  display:flex;flex-direction:column;gap:1px;transition:box-shadow .15s,transform .15s}
.bloc:hover{box-shadow:var(--o1)}
.bloc.prend{cursor:grabbing;box-shadow:var(--o3);z-index:5;opacity:.92}
.bloc b{font-size:14px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.bloc span{font-family:var(--num);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bloc.court{flex-direction:row;align-items:baseline;gap:8px;padding:4px 11px}
.bloc.court b{font-size:13px}
.bloc.fini{opacity:.5}
.bloc.fini b{text-decoration:line-through}
.bloc .poignee-b{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize}

.trait-now{position:absolute;left:0;right:0;height:2px;background:var(--tard);z-index:4;pointer-events:none}
.trait-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--tard)}

.jours-tete{display:grid;grid-template-columns:52px minmax(0,1fr);padding:14px 20px 0 0}
.jours-tete .cases{display:grid;gap:6px}
.jours-tete b{text-align:center;font-size:12.5px;font-weight:700;color:var(--ink-3);padding-bottom:8px;text-transform:capitalize}
.jours-tete b.ici{color:var(--v1)}

.barre-agenda{display:flex;align-items:center;gap:10px;padding:16px 24px 6px}
.barre-agenda .jourdit{font-family:var(--num);font-weight:600;font-size:19px;letter-spacing:-.015em;flex:1;min-width:0;text-transform:capitalize}
.fleche{border:0;background:var(--surface-3);color:var(--ink-2);width:36px;height:36px;border-radius:50%;
  display:grid;place-content:center;flex:none;transition:background .18s,color .18s}
.fleche svg{width:17px;height:17px;stroke-width:2.4;fill:none}
.fleche:hover{background:var(--line);color:var(--v1)}

/* ═══ l'heure d'une tâche ═══ */
.heure{font-family:var(--num);font-weight:600;font-size:15px;color:var(--ink-2);flex:none;
  min-width:52px;text-align:right;font-variant-numeric:tabular-nums;padding-top:2px}
.t.passee .heure{color:var(--ink-3)}
.t.encours{background:linear-gradient(90deg,var(--deg-pale),transparent 60%)}
.t.encours .heure{color:var(--v1)}

.maintenant{display:flex;align-items:center;gap:14px;padding:18px 24px;background:rgba(255,255,255,.1);
  border-radius:calc(var(--rxl) - 7px);margin:0 4px 4px;color:#fff}
.maintenant .quand-m{font-family:var(--num);font-weight:600;font-size:15px;opacity:.75;flex:none}
.maintenant .quoi{flex:1;min-width:0;font-size:16.5px;font-weight:600;overflow-wrap:anywhere}
.maintenant .pastille-m{width:9px;height:9px;border-radius:50%;background:#fff;flex:none;
  box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:battement 2.4s infinite}
@keyframes battement{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}
  70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
}

/* ═══ ajout express ═══ */
.vite{display:flex;align-items:center;gap:16px;padding:19px 24px;position:relative}
.vite::before{content:"";position:absolute;left:64px;right:24px;top:0;height:1px;background:var(--line)}
.vite .rond{width:28px;height:28px;flex:none;border:2.5px dashed var(--line-fort);border-radius:50%;display:grid;place-content:center;color:var(--ink-3);font-size:17px;line-height:1}
.ajout-ligne .rond svg{color:var(--ink-3)}
.vite .rond::after{content:"+"}
.vite input{flex:1;min-width:0;border:0;background:none;font-size:16.5px;font-weight:600;padding:2px 0;outline:0}
.vite input::placeholder{color:var(--ink-3);font-weight:600}
.vite .go{border:0;border-radius:999px;padding:9px 18px;background:var(--deg);color:#fff;font-weight:700;font-size:14.5px;opacity:0;transform:scale(.9);transition:opacity .18s,transform .18s var(--ressort);pointer-events:none}
.vite input:not(:placeholder-shown) ~ .go{opacity:1;transform:none;pointer-events:auto}

.ajout-ligne{display:flex;align-items:center;gap:16px;padding:19px 24px;width:100%;border:0;background:none;
  font-size:16.5px;font-weight:600;color:var(--ink-3);text-align:left;position:relative;transition:color .18s}
.ajout-ligne::before{content:"";position:absolute;left:64px;right:24px;top:0;height:1px;background:var(--line)}
.ajout-ligne .rond{width:28px;height:28px;flex:none;border:2.5px dashed var(--line-fort);border-radius:50%;display:grid;place-content:center;font-size:17px;line-height:1}
.ajout-ligne .rond::after{content:"+"}
.ajout-ligne:hover{color:var(--v1)}
.ajout-ligne:hover .rond{border-color:var(--v1);border-style:solid}

/* ═══ segments ═══ */
.segments{display:flex;gap:5px;padding:7px;background:var(--surface-3);border-radius:999px;margin:16px 24px 12px}
.segments::-webkit-scrollbar{display:none}
.segments button{flex:1;border:0;background:none;color:var(--ink-2);padding:14px 10px;border-radius:999px;font-size:16.5px;font-weight:700;white-space:nowrap;text-align:center;transition:color .2s,background .2s}
.segments button[aria-pressed="true"]{background:var(--surface);color:var(--v1);box-shadow:var(--o1)}

/* ═══ rangées argent ═══ */
.r{display:flex;align-items:center;gap:15px;padding:18px 24px;position:relative;transition:background .15s}
.r + .r::before{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:var(--line)}
.r:hover{background:var(--surface-2)}
.pastille{width:48px;height:48px;border-radius:16px;flex:none;display:grid;place-content:center;text-align:center;font-family:var(--num);font-weight:600;font-size:15px;line-height:1.05}
.pastille svg{width:23px;height:23px;stroke-width:2.4;fill:none}
.pastille.feu{background:var(--tard-doux);color:var(--tard)}
.pastille.ok{background:var(--ok-doux);color:var(--ok)}
.pastille.att{background:var(--surface-3);color:var(--ink-2)}
.pastille.amb{background:var(--attente-doux);color:var(--attente)}
.pastille small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.r-corps{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.r-titre{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.r-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px;font-size:13.5px;color:var(--ink-3)}
.r-som{font-family:var(--num);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;text-align:right;flex:none}
.r-som.paye{color:var(--ok)}
.pdf{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;flex:none;transition:border-color .18s,color .18s,background .18s,transform .12s}
.pdf svg{width:15px;height:15px;stroke-width:2.3;fill:none}
.pdf:hover{border-color:var(--v1);color:var(--v1);background:var(--deg-pale)}
.pdf:active{transform:scale(.95)}
.mini{border:2px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:700;flex:none;transition:border-color .18s,color .18s,background .18s,transform .12s}
.mini:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-doux)}
.mini:active{transform:scale(.95)}

/* ═══ tuiles cliquables ═══ */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:439px){ .duo{grid-template-columns:1fr} }
.tuile{background:var(--tuile-neutre);border:0;border-radius:var(--rm);padding:19px 20px;box-shadow:var(--o1);display:flex;flex-direction:column;gap:4px;text-align:left;transition:transform .18s var(--doux),box-shadow .2s}
button.tuile:hover{transform:translateY(-2px);box-shadow:var(--o3)}
button.tuile:active{transform:scale(.985)}
.tuile .lab{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-3);font-weight:700}
.tuile .lab svg{width:17px;height:17px;stroke-width:2.2;fill:none}
.tuile .val{font-family:var(--num);font-weight:600;font-size:30px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.15}
.tuile .sous{font-size:13.5px;color:var(--ink-3)}
.tuile.chaud{background:var(--tuile-chaud)}
.tuile.chaud .val,.tuile.chaud .sous,.tuile.chaud .lab{color:var(--tard)}
.tuile.vert{background:var(--tuile-vert)}
.tuile.vert .val{color:var(--ok)}

/* ═══ fiche d'un client ═══ */
.retour{display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--ink-2);
  font-size:15px;font-weight:700;padding:6px 4px;border-radius:10px;transition:color .18s}
.retour svg{width:19px;height:19px;stroke-width:2.4;fill:none}
.retour:hover{color:var(--v1)}
.tete-client{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:20px 22px 4px}
.tete-client h2{font-family:var(--num);font-weight:600;font-size:24px;letter-spacing:-.02em;flex:1;min-width:0;overflow-wrap:anywhere}
.tete-client p{width:100%;font-size:15px;color:var(--ink-2);margin-top:-2px}
.paye{padding:16px 22px 22px}
.paye .gros{font-family:var(--num);font-weight:600;font-size:38px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ok)}
.paye .lab{font-size:14px;font-weight:600;color:var(--ink-3)}
.paye .reste{margin-top:8px;font-size:14.5px;color:var(--ink-2)}
.paye .reste b{font-family:var(--num);font-weight:600;color:var(--tard)}

/* ═══ notes ═══ */
.note{display:flex;gap:13px;padding:14px 22px;position:relative}
.note + .note::before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:var(--line)}
.note-corps{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.note-txt{font-size:15.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.note-date{font-size:13px;color:var(--ink-3);font-weight:600}
.note .sup{align-self:flex-start;opacity:.32}
.note:hover .sup{opacity:1}
.ecrire{display:flex;align-items:flex-end;gap:11px;padding:14px 22px;border-top:1px solid var(--line)}
.ecrire textarea{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface-2);border-radius:var(--rs);
  padding:12px 14px;font:inherit;font-size:15.5px;font-weight:600;resize:none;min-height:50px;max-height:180px;transition:border-color .18s,background .18s}
.ecrire textarea:focus{outline:0;border-color:var(--v1);background:var(--surface)}
.ecrire textarea::placeholder{color:var(--ink-3);font-weight:400}
.ecrire .go{border:0;border-radius:999px;padding:13px 19px;background:var(--deg);color:#fff;font-weight:700;font-size:14.5px;
  opacity:0;transform:scale(.9);transition:opacity .18s,transform .18s var(--ressort);pointer-events:none;flex:none}
.ecrire textarea:not(:placeholder-shown) ~ .go{opacity:1;transform:none;pointer-events:auto}

/* ═══ clients ═══ */
.fiches{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:13px;padding:0 20px 22px}
.fiche{background:var(--surface-2);border-radius:var(--rm);padding:18px 19px 16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .2s var(--doux),box-shadow .2s}
.fiche:hover{transform:translateY(-2px);box-shadow:var(--o1)}
.fiche h3{font-family:var(--num);font-weight:600;font-size:18px;overflow-wrap:anywhere}
.fiche .projet{font-size:14.5px;color:var(--ink-2);flex:1}
.fiche .chiffres{display:flex;align-items:baseline;gap:6px;font-family:var(--num);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.fiche .chiffres small{font-family:var(--ui);font-size:13px;font-weight:600;color:var(--ink-3)}
.fiche-pied{display:flex;align-items:center;gap:10px;margin-top:auto;flex-wrap:wrap}
.fiche .sup{opacity:.3;margin-left:auto}
.etat-btn{border:0;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700;cursor:pointer;transition:filter .18s,transform .12s}
.etat-btn:hover{filter:brightness(.96)}
.etat-btn:active{transform:scale(.95)}
.etat-btn.feu{background:var(--tard-doux);color:var(--tard)}
.etat-btn.ok{background:var(--ok-doux);color:var(--ok)}
.etat-btn.att{background:var(--surface-3);color:var(--ink-2)}
.etat-btn.amb{background:var(--attente-doux);color:var(--attente)}

/* ═══ rituel ═══ */
.rituel{list-style:none;margin:0;padding:2px 22px 14px;display:flex;flex-direction:column}
.rituel li{display:flex;align-items:center;gap:13px;padding:12px 0;position:relative}
.rituel li + li::before{content:"";position:absolute;left:41px;right:0;top:0;height:1px;background:var(--line)}
.rituel label{display:flex;align-items:center;gap:13px;cursor:pointer;font-size:15.5px;flex:1}
.rituel .n{font-family:var(--num);font-weight:600;font-size:13px;color:var(--ink-3);width:15px;flex:none}
.rituel .txt{transition:color .2s}
.rituel input:checked ~ .txt{color:var(--ink-3);text-decoration:line-through}

/* ═══ navigation : libellés toujours visibles ═══ */
.nav{position:fixed;z-index:40;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:7px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--o3);max-width:calc(100vw - 20px)}
@supports (backdrop-filter:blur(2px)){
  .nav{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink-2);padding:12px 17px;border-radius:999px;
  font-size:15px;font-weight:700;white-space:nowrap;transition:color .2s var(--doux),background .25s var(--doux),transform .15s}
.nav button svg{width:21px;height:21px;flex:none;stroke-width:2.1;fill:none}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--deg);color:#fff}
.nav .compte{display:grid;place-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--tard);color:#fff;font-family:var(--num);font-size:12px;font-weight:600}
.nav button[aria-current="page"] .compte{background:#fff;color:var(--v2)}
.nav .plus{background:var(--deg);color:#fff;margin-left:4px}
.nav .plus:hover{color:#fff;transform:scale(1.05)}
.nav .plus:active{transform:scale(.94)}
.nav .plus svg{stroke-width:2.8}

/* ═══ feuille ═══ */
.voile{position:fixed;inset:0;z-index:50;background:rgba(10,22,36,.48);opacity:0;transition:opacity .28s var(--doux)}
.voile.on{opacity:1}
.feuille{position:fixed;z-index:51;left:50%;bottom:0;transform:translate(-50%,102%);width:min(560px,100%);background:var(--surface);
  border-radius:var(--rxl) var(--rxl) 0 0;box-shadow:var(--o3);transition:transform .38s var(--doux);max-height:92vh;overflow-y:auto}
.feuille.on{transform:translate(-50%,0)}
@media(min-width:560px){ .feuille{bottom:26px;border-radius:var(--rxl)} }
.poignee{width:44px;height:5px;border-radius:99px;background:var(--line-fort);margin:12px auto 0}
.feuille-tete{display:flex;align-items:center;gap:12px;padding:18px 24px 6px}
.feuille-tete h2{font-family:var(--num);font-weight:600;font-size:22px;letter-spacing:-.02em}
.fermer{margin-left:auto;border:0;background:var(--surface-3);color:var(--ink-2);width:36px;height:36px;border-radius:50%;display:grid;place-content:center;font-size:21px;line-height:1;transition:background .2s}
.fermer:hover{background:var(--line)}
form{padding:12px 24px 28px;display:flex;flex-direction:column;gap:15px}
.champ{display:flex;flex-direction:column;gap:7px}
.champ label{font-size:14.5px;font-weight:700;color:var(--ink-2)}
.champ input,.champ select{background:var(--surface-2);border:2px solid var(--line);border-radius:var(--rs);padding:14px 15px;width:100%;font-size:16px;font-weight:600;transition:border-color .18s,background .18s}
.champ input:focus,.champ select:focus{outline:0;border-color:var(--v1);background:var(--surface)}
.champ input::placeholder{color:var(--ink-3);font-weight:400}
.paire{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choix{display:flex;gap:8px;flex-wrap:wrap}
.choix > label{flex:1;min-width:92px;position:relative}
.choix input{position:absolute;opacity:0;width:0;height:0}
.choix span{display:block;text-align:center;padding:12px 8px;border-radius:var(--rs);border:2px solid var(--line);background:var(--surface-2);font-size:15px;font-weight:700;color:var(--ink-2);transition:border-color .18s,background .18s,color .18s}
.choix input:checked + span{border-color:var(--v1);background:var(--deg-pale);color:var(--v1)}
.choix input:focus-visible + span{outline:3px solid var(--v1);outline-offset:2px}
.valider{border:0;border-radius:999px;padding:17px;background:var(--deg);color:#fff;font-family:var(--num);font-weight:600;font-size:18px;transition:transform .16s var(--ressort),filter .2s;margin-top:4px}
.valider:hover{filter:brightness(1.1)}
.valider:active{transform:scale(.975)}

/* ═══ repli ═══ */
.detail{border-top:1px solid var(--line);padding-top:11px;display:flex;flex-direction:column}
.detail summary{cursor:pointer;font-size:15px;font-weight:700;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:10px;padding:7px 0}
.detail summary::-webkit-details-marker{display:none}
.detail summary::before{content:"+";font-family:var(--num);font-weight:600;font-size:17px;width:24px;height:24px;border-radius:50%;background:var(--surface-3);display:grid;place-content:center;line-height:1;flex:none}
.detail[open] summary::before{content:"\2212"}
.detail > *:not(summary){margin-top:15px}
.date-libre{margin-top:11px}
.aide{font-size:14px;color:var(--ink-3);margin-top:-7px}
summary.carte-tete{list-style:none}
summary.carte-tete::-webkit-details-marker{display:none}
summary.carte-tete::after{content:"";width:9px;height:9px;border-right:2.6px solid var(--ink-3);border-bottom:2.6px solid var(--ink-3);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s var(--doux);flex:none}
details[open] > summary.carte-tete::after{transform:rotate(-135deg) translate(-3px,-3px)}
summary.carte-tete:hover h2{color:var(--v1)}

/* ═══ premier lancement ═══ */
.bienvenue{background:var(--surface);border-radius:var(--rxl);box-shadow:var(--o1);padding:38px 26px 32px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.bienvenue h2{font-family:var(--num);font-weight:600;font-size:27px;letter-spacing:-.02em}
.bienvenue p{font-size:16px;color:var(--ink-2);max-width:38ch}
.etapes{display:flex;flex-direction:column;gap:15px;margin:16px 0 4px;text-align:left;width:100%;max-width:400px}
.etape{display:flex;gap:14px;align-items:flex-start;font-size:15px;color:var(--ink-2)}
.etape .rondi{width:40px;height:40px;border-radius:14px;flex:none;background:var(--deg-pale);display:grid;place-content:center;color:var(--v1)}
.etape .rondi svg{width:21px;height:21px;stroke-width:2.1;fill:none}
.etape b{display:block;color:var(--ink);font-weight:700;font-size:16px}
.bienvenue .valider{padding:17px 34px;margin-top:10px}

/* ═══ bulle ═══ */
.bulle{position:fixed;z-index:60;left:50%;bottom:100px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--ground);padding:14px 20px;border-radius:999px;
  font-size:15px;font-weight:700;box-shadow:var(--o3);transition:opacity .26s var(--doux),transform .34s var(--ressort);max-width:calc(100vw - 32px)}
.bulle.on{opacity:1;transform:translate(-50%,0)}
.bulle svg{width:18px;height:18px;flex:none;color:var(--ok);fill:none}
#confettis{position:fixed;inset:0;z-index:55;pointer-events:none}

/* ═══ démo + pied ═══ */
.demo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 19px;background:var(--surface);border-radius:var(--rm);box-shadow:var(--o1);font-size:14px;color:var(--ink-2)}
.demo b{font-weight:700;color:var(--ink)}
.demo button{margin-left:auto;border:0;background:var(--surface-3);color:var(--ink-2);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;transition:background .18s,color .18s}
.demo button:hover{background:var(--deg-pale);color:var(--v1)}
.demo button[data-arme="1"]{background:var(--tard);color:#fff}
.pied{text-align:center;font-size:13px;color:var(--ink-3);padding:8px 10px 0;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
.pied i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pied button{border:0;background:var(--surface);color:var(--ink-2);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:var(--o1);transition:color .18s}
.pied button:hover{color:var(--v1)}
.pied button[data-arme="1"]{background:var(--tard);color:#fff}
.pied i.ko{background:var(--tard)}

.anim{animation:monte .5s var(--doux) backwards}
.sans-anim .anim{animation:none}
@keyframes monte{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media(max-width:520px){
  .nav{width:calc(100vw - 16px);max-width:none;justify-content:space-between;padding:6px;gap:0}
  .nav button{padding:10px 11px;gap:6px;font-size:14px}
  .nav button svg{width:19px;height:19px}
  .nav .plus{margin-left:0;padding:10px 12px}
  .nav .plus .nom{display:none}
  .nav button .nom{display:none}
  .nav button[aria-current="page"] .nom{display:inline}
  .nav button{padding:10px}
  .nav button[aria-current="page"]{padding:10px 14px 10px 11px}
  /* le compteur devient un point : le chiffre reste lisible dans la page */
  .nav .compte{width:9px;height:9px;min-width:0;padding:0;font-size:0;border-radius:50%;margin-left:-2px}
  .t{gap:13px;padding:14px 16px}
  .t + .t::before{left:52px;right:16px}
  .vite{padding:14px 16px;gap:13px}
  .vite::before{left:52px;right:16px}
  .r{padding:14px 40px 14px 16px;gap:9px 12px;flex-wrap:wrap;position:relative}
  .r + .r::before{left:16px;right:16px}
  .r .pastille{width:42px;height:42px;border-radius:14px;font-size:14px}
  .r .r-corps{flex:1 1 52%}
  .r .r-som{margin-left:auto}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.1/jspdf.umd.min.js"></script>
<script>
"use strict";
const SEED = __SEED__;

const RITUEL = [
  "Réclamer l'argent en retard",
  "Ranger la boîte mail",
  "Choisir les 3 priorités de la semaine"
];
const COLS = ["taches", "clients", "factures", "depenses", "investissements"];
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const MOIS_LONG = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

const state = {
  taches: {}, clients: {}, factures: {}, depenses: {}, investissements: {},
  moi: {nom: "", adresse: "", siret: "", email: "", tva: 0, regime: "services", liberatoire: false, objectif: 0, joursFactures: 200},
  rituel: {semaine: "", faits: []},
  serie: {n: 0, dernier: ""}
};
let vue = "afaire";
let filtreT = "afaire";
let filtreF = "encaisser";
let filtreB = "depenses";
let clientOuvert = null;
let pliOuvert = false;
let vueAgenda = "jour";        /* jour · semaine · liste */
let jourVu = null;             /* null = aujourd'hui */
const memoire = new Map();
let stockOk = true;
let animer = true;
let anneauP = 0;

/* ───────── outils ───────── */
const $ = s => document.querySelector(s);
const h = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const nf = new Intl.NumberFormat("fr-FR", {maximumFractionDigits: 0});
const eur = n => nf.format(Math.round(Number(n) || 0)) + " €";
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const auj = () => iso(new Date());
const dans = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const dt = s => new Date(s + "T12:00:00");
const jours = s => s ? Math.round((dt(s) - dt(auj())) / 86400000) : 0;
const jour = s => s ? dt(s).getDate() + " " + MOIS[dt(s).getMonth()] : "—";
function jourLong(iso){
  if(!iso) return "";
  const d = new Date(iso), a = auj();
  const j = iso.slice(0, 10);
  const heure = d.toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"});
  if(j === a) return "aujourd'hui à " + heure;
  if(j === dans(-1)) return "hier à " + heure;
  return "le " + d.getDate() + " " + MOIS[d.getMonth()] + " à " + heure;
}
const liste = c => Object.entries(state[c]).map(([id, o]) => Object.assign({id: id}, o));
const neuf = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const reduit = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function semaineIso(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const j1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return t.getUTCFullYear() + "-S" + String(Math.ceil(((t - j1) / 86400000 + 1) / 7)).padStart(2, "0");
}
function statut(f){
  if(f.statut === "brouillon") return "brouillon";
  if(f.statut === "payee") return "payee";
  return jours(f.echeance) < 0 ? "retard" : "envoyee";
}
const ETIQ_F = {brouillon: ["À envoyer", "att"], payee: ["Payé", "ok"], retard: ["Pas payé", "feu"], envoyee: ["En attente", "amb"]};
const COURT_F = {brouillon: "brln", payee: "payé", retard: "retard", envoyee: "env."};
const ETIQ_C = {actif: ["En cours", "amb"], prospect: ["Prospect", "att"], termine: ["Terminé", "ok"]};

/* ───────── mémoire du navigateur ───────── */
function sauver(){
  try{
    localStorage.setItem("cadence.v2", JSON.stringify(state));
    stockOk = true;
  }catch(e){ stockOk = false; }
}
function charger(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem("cadence.v2") || localStorage.getItem("cadence.v1") || "null"); }catch(e){}
  if(d && typeof d === "object"){
    COLS.forEach(c => { state[c] = d[c] && typeof d[c] === "object" ? d[c] : {}; });
    if(d.rituel) state.rituel = d.rituel;
    if(d.moi) state.moi = Object.assign({nom: "", adresse: "", siret: "", email: "", tva: 0, regime: "services", liberatoire: false, objectif: 0, joursFactures: 200}, d.moi);
    if(d.serie) state.serie = d.serie;
  }else{
    COLS.forEach(c => { state[c] = JSON.parse(JSON.stringify(SEED[c] || {})); });
  }
}
function ecrire(col, id, obj){ state[col][id] = obj; sauver(); rendre(); }
function retirer(col, id){ delete state[col][id]; sauver(); rendre(); }

function majSerie(){
  const a = auj(), s = state.serie;
  if(s.dernier === a) return false;
  s.n = s.dernier === dans(-1) ? s.n + 1 : 1;
  s.dernier = a;
  return true;
}

/* ───────── calculs ───────── */
function calculs(){
  const tach = liste("taches"), fact = liste("factures");
  const a = auj();
  const duJour = tach.filter(t => String(t.echeance) <= a);
  const faitsJour = duJour.filter(t => t.fait);
  const resteJour = duJour.filter(t => !t.fait);
  const attente = fact.filter(f => statut(f) === "envoyee" || statut(f) === "retard");
  const impayees = attente.filter(f => statut(f) === "retard");
  const moisIci = a.slice(0, 7);
  const dPrec = new Date(); dPrec.setDate(1); dPrec.setMonth(dPrec.getMonth() - 1);
  const parMois = m => fact.filter(f => f.statut !== "brouillon" && String(f.emise || "").slice(0, 7) === m)
                           .reduce((s, f) => s + (Number(f.montant) || 0), 0);
  return {
    tach: tach, fact: fact,
    duJour: duJour, faitsJour: faitsJour, resteJour: resteJour,
    enRetard: resteJour.filter(t => jours(t.echeance) < 0),
    attente: attente, impayees: impayees, parMois: parMois, moisIci: moisIci,
    caIci: parMois(moisIci), caAvant: parMois(iso(dPrec).slice(0, 7)),
    duAttente: attente.reduce((s, f) => s + (Number(f.montant) || 0), 0),
    duRetard: impayees.reduce((s, f) => s + (Number(f.montant) || 0), 0),
    encaisse: fact.filter(f => statut(f) === "payee" && String(f.emise || "").slice(0, 7) === moisIci)
                  .reduce((s, f) => s + (Number(f.montant) || 0), 0)
  };
}
/* Une facture dépassée engendre sa propre tâche de relance.
   Cochée, elle se tait une semaine ; payée, elle disparaît pour de bon. */
function relancesAuto(){
  return liste("factures").filter(f => statut(f) === "retard").filter(f => {
    if(!f.relance) return true;
    return Math.round((dt(auj()) - new Date(f.relance)) / 86400000) >= 7;
  }).map(f => ({
    id: "auto-" + f.id,
    auto: true,
    titre: "Relancer " + f.client + " — " + (f.ref || "facture"),
    client: f.client,
    montant: f.montant,
    echeance: f.echeance,
    priorite: "haute",
    fait: false
  }));
}

/* « déjeuner client 12h30 » : on retire l'heure du titre et on la garde */
function lireHeure(texte){
  const m = /(?:^|\s)(?:à\s*)?(\d{1,2})\s*(?:h|:)\s*(\d{2})?(?=\s|$)/i.exec(texte);
  if(!m) return {titre: texte.trim(), heure: ""};
  const hh = Number(m[1]), mm = Number(m[2] || 0);
  if(hh > 23 || mm > 59) return {titre: texte.trim(), heure: ""};
  const titre = (texte.slice(0, m.index) + " " + texte.slice(m.index + m[0].length)).replace(/\s+/g, " ").trim();
  return {titre: titre || texte.trim(), heure: String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0")};
}
const minutesMaintenant = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const enMinutes = h => h ? Number(h.slice(0, 2)) * 60 + Number(h.slice(3, 5)) : null;
const heureLisible = h => h ? h.replace(":", " h ").replace(/ 00$/, "").trim() : "";

const ritFaits = () => state.rituel.semaine === semaineIso(new Date()) ? (state.rituel.faits || []) : [];

/* ───────── entête ───────── */
function rendreEntete(){
  const d = new Date(), hr = d.getHours();
  const salut = hr < 6 ? "Bonne nuit" : hr < 12 ? "Bonjour" : hr < 18 ? "Bon après-midi" : "Bonsoir";
  const s = state.serie;
  const vive = s.n > 0 && (s.dernier === auj() || s.dernier === dans(-1));
  const flamme = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7c.6 3.4-1.8 4.4-2.9 6.4-1.5 2.6.3 4.6 1.4 4.9-.5-1.9.6-3.3 1.5-3.9 0 1.6 1 2.3 1.9 3.4 1.6 1.9.5 4.3-.5 5.1 3.4-.7 5.6-3.4 5.6-6.6 0-4.6-4.3-6.2-7-9.3Z"/><path d="M8.4 20.6c-1.6-1-2.6-2.6-2.7-4.6"/></svg>';
  $("#entete").innerHTML =
    '<div><h1 class="bonjour">' + salut + '</h1><p class="quand">'
    + d.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"})
    + '</p></div><div class="serie' + (vive ? " active" : "") + '" title="Jours d\'affilée avec au moins une tâche terminée">'
    + flamme
    + (s.n > 0 ? "<b>" + s.n + "</b><span>jour" + (s.n > 1 ? "s" : "") + " d'affilée</span>" : "<span>Aucune série</span>")
    + "</div>";
}

/* ───────── tâches ───────── */
function ligneTache(t, ctx){
  const j = jours(t.echeance);
  if(t.auto){
    return '<div class="t auto">'
      + '<input type="checkbox" class="coche" id="k-' + h(t.id) + '" data-relance="' + h(t.id.slice(5)) + '" aria-label="J\'ai relancé ' + h(t.client) + '">'
      + '<span class="t-corps"><label class="t-titre" for="k-' + h(t.id) + '">' + h(t.titre) + "</label>"
      + '<span class="t-meta"><span>' + eur(t.montant) + "</span>"
      + '<span class="etiq feu"><i class="point"></i>' + (-j) + " jour" + (j < -1 ? "s" : "") + " de retard</span>"
      + '<span class="etiq robot"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M13 2.5 4.5 13.5H11l-.8 8L19.5 10H13Z"/></svg>ajouté pour vous</span>'
      + "</span></span></div>";
  }
  let et = "";
  if(ctx === "retard"){
    et = '<span class="etiq feu"><i class="point"></i>' + (j === -1 ? "1 jour de retard" : (-j) + " jours de retard") + "</span>";
  }else if(ctx === "plustard"){
    et = '<span class="etiq amb">' + (j === 1 ? "demain" : "le " + jour(t.echeance)) + "</span>";
  }
  const meta = (t.client ? "<span>" + h(t.client) + "</span>" : "")
    + (t.priorite === "haute" && !t.fait ? '<span class="etiq feu">Important</span>' : "")
    + et;
  /* une tâche à l'heure : passée, en cours, ou à venir */
  let etat = "";
  if(t.heure && ctx === "aujourdhui" && !t.fait){
    const deb = enMinutes(t.heure), now = minutesMaintenant();
    etat = now >= deb && now < deb + 60 ? " encours" : (now >= deb + 60 ? " passee" : "");
  }
  return '<div class="t' + (t.fait ? " ok" : "") + etat + '">'
    + '<input type="checkbox" class="coche" id="k-' + h(t.id) + '" data-tache="' + h(t.id) + '"' + (t.fait ? " checked" : "") + ' aria-label="Terminer : ' + h(t.titre) + '">'
    + '<span class="t-corps" data-modif="tache" data-id="' + h(t.id) + '" role="button" tabindex="0">'
    + '<span class="t-titre">' + h(t.titre) + "</span>"
    + (meta ? '<span class="t-meta">' + meta + "</span>" : "") + "</span>"
    + (t.heure ? '<span class="heure">' + heureLisible(t.heure) + "</span>" : "")
    + '<button class="sup" data-sup="taches" data-id="' + h(t.id) + '"><span class="mot">Supprimer</span></button></div>';
}
/* ═══ la journée en heures ═══ */
const DEBUT_J = 7 * 60, FIN_J = 21 * 60;      /* la piste va de 7 h à 21 h */
const ETENDUE = FIN_J - DEBUT_J;
const HAUTEUR_H = 62;                          /* pixels par heure */
const DUREE_DEFAUT = 60;
const DUREES = [[15, "15 min"], [30, "30 min"], [45, "45 min"], [60, "1 h"], [90, "1 h 30"], [120, "2 h"], [180, "3 h"], [240, "4 h"]];

const jourAffiche = () => jourVu || auj();
function decalerJour(pas){
  const d = dt(jourAffiche());
  d.setDate(d.getDate() + pas);
  jourVu = iso(d);
}
function lundiDe(isoJour){
  const d = dt(isoJour);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return iso(d);
}
function tachesDu(isoJour){
  return liste("taches").filter(t => String(t.echeance) === isoJour);
}
function blocsDe(isoJour){
  return tachesDu(isoJour).filter(t => t.heure)
    .map(t => Object.assign({}, t, {deb: enMinutes(t.heure), duree: Number(t.duree) || DUREE_DEFAUT}))
    .sort((a, b) => a.deb - b.deb);
}

/* deux blocs qui se chevauchent se partagent la largeur */
function repartir(blocs){
  const colonnes = [];
  blocs.forEach(b => {
    let i = 0;
    while(colonnes[i] && colonnes[i] > b.deb) i++;
    colonnes[i] = b.deb + b.duree;
    b.col = i;
  });
  const total = Math.max(1, colonnes.length);
  blocs.forEach(b => { b.large = 100 / total; b.gauche = b.col * (100 / total); });
  return blocs;
}

function unBloc(b, dansSemaine){
  const haut = (b.deb - DEBUT_J) / ETENDUE * 100;
  const haut2 = Math.max(2.6, b.duree / ETENDUE * 100);
  const court = b.duree <= 35;
  return '<div class="bloc' + (court ? " court" : "") + (b.fait ? " fini" : "") + '"'
    + ' data-bloc="' + h(b.id) + '"'
    + ' style="top:' + haut.toFixed(2) + "%;height:" + haut2.toFixed(2) + "%;"
    + (dansSemaine ? "" : "left:calc(" + b.gauche.toFixed(1) + "% + 2px);width:calc(" + b.large.toFixed(1) + "% - 4px);")
    + '">'
    + "<b>" + h(b.titre) + "</b>"
    + '<span>' + heureLisible(b.heure) + "</span>"
    + '<span class="poignee-b" data-etirer="' + h(b.id) + '"></span></div>';
}

function pisteHeures(){
  let out = '<div class="heures">';
  for(let hh = 7; hh <= 21; hh++){
    const y = (hh * 60 - DEBUT_J) / ETENDUE * 100;
    out += "<b style=\"top:" + y.toFixed(2) + '%">' + hh + " h</b>";
  }
  return out + "</div>";
}
function trames(){
  let out = '<div class="trames">';
  for(let hh = 7; hh <= 21; hh++){
    out += '<i style="top:' + ((hh * 60 - DEBUT_J) / ETENDUE * 100).toFixed(2) + '%"></i>';
  }
  return out + "</div>";
}
function traitMaintenant(isoJour){
  if(isoJour !== auj()) return "";
  const m = minutesMaintenant();
  if(m < DEBUT_J || m > FIN_J) return "";
  return '<div class="trait-now" style="top:' + ((m - DEBUT_J) / ETENDUE * 100).toFixed(2) + '%"></div>';
}

function parHeure(a, b){
  const ha = a.heure || "", hb = b.heure || "";
  if(ha && hb) return ha.localeCompare(hb);
  if(ha) return -1;
  if(hb) return 1;
  return 0;
}
const listeTaches = (arr, ctx) => arr.slice().sort(parHeure).map(t => ligneTache(t, ctx)).join("");
const ligneVite = () => '<div class="vite"><span class="rond"></span>'
  + '<input id="vite" placeholder="Ajouter… « devis 14h »" maxlength="140" autocomplete="off" aria-label="Ajouter une tâche pour aujourd\'hui">'
  + '<button class="go" data-vite="1">Ajouter</button></div>';

/* ───────── vue : aujourd'hui ───────── */
function toutVide(){
  for(let i = 0; i < COLS.length; i++){ if(Object.keys(state[COLS[i]]).length) return false; }
  return true;
}
function bienvenue(){
  const ic = {
    liste: '<path d="M4 7h16M4 12h16M4 17h10"/>',
    euro: '<path d="M16.5 7.5a5.5 5.5 0 1 0 0 9M4.5 10.5h7M4.5 13.5h7"/>',
    calendrier: '<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 2.8v3.4M16 2.8v3.4"/>'
  };
  const l = (k, t, d) => '<span class="etape"><span class="rondi"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'
    + ic[k] + '</svg></span><span><b>' + t + "</b>" + d + "</span></span>";
  return '<section class="bienvenue anim"><h2>Vous êtes chez vous</h2>'
    + "<p>Rien à installer, rien à régler. Écrivez ce que vous avez à faire : le reste suit tout seul.</p>"
    + '<div class="etapes">'
    + l("liste", "Ce que vous devez faire", "Une liste qui se vide, jour après jour.")
    + l("euro", "Qui vous doit de l'argent", "Vos factures, et celles qui traînent.")
    + l("calendrier", "Ce qu'il vous reste", "Ce qui rentre, moins ce qui sort.")
    + "</div>"
    + '<button class="valider" data-premier="1">Ajouter ma première tâche</button></section>';
}
function vueAfaire(){
  if(toutVide()) return bienvenue();
  const c = calculs();
  const relances = relancesAuto().length;
  const total = c.duJour.length + relances, faits = c.faitsJour.length;
  const p = total ? faits / total : 0;
  const jour0 = jourAffiche();
  const cestAujourdhui = jour0 === auj();

  /* ── la coiffe : anneau et titre ── */
  let tete;
  if(total > 0 && faits === total && cestAujourdhui){
    tete = '<div class="fini"><span class="coche-geante"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>'
      + "<h2>Journée finie</h2></div>";
  }else{
    tete = '<div class="jour"><div class="anneau"><svg viewBox="0 0 120 120" aria-hidden="true">'
      + '<circle class="piste" cx="60" cy="60" r="46"/>'
      + '<circle class="jauge" cx="60" cy="60" r="46" stroke-dashoffset="' + (289.03 * (1 - anneauP)) + '" data-p="' + p + '"/></svg>'
      + '<span class="milieu"><b>' + faits + '</b><em>sur ' + total + "</em></span></div>"
      + "<h2>Votre journée</h2></div>";
  }

  /* ── ce qui vient ── */
  let bandeau = "";
  if(cestAujourdhui){
    const aHeure = c.resteJour.filter(t => t.heure).sort(parHeure);
    const now = minutesMaintenant();
    const suiv = aHeure.find(t => enMinutes(t.heure) + (Number(t.duree) || DUREE_DEFAUT) > now);
    if(suiv){
      const deb = enMinutes(suiv.heure), reste = deb - now;
      const quand = now >= deb ? "en ce moment" : (reste < 60 ? "dans " + reste + " min" : heureLisible(suiv.heure));
      bandeau = '<div class="maintenant">' + (now >= deb ? '<span class="pastille-m"></span>' : "")
        + '<span class="quand-m">' + quand + '</span><span class="quoi">' + h(suiv.titre) + "</span></div>";
    }
  }

  /* ── le choix de vue ── */
  const vues = [["jour", "Jour"], ["semaine", "Semaine"], ["liste", "Liste"]];
  let corps = '<div class="segments">' + vues.map(kv =>
    '<button data-va="' + kv[0] + '" aria-pressed="' + (vueAgenda === kv[0]) + '">' + kv[1] + "</button>").join("") + "</div>";

  if(vueAgenda === "liste"){
    corps += listeClassique(c);
  }else if(vueAgenda === "jour"){
    const dj = dt(jour0);
    corps += '<div class="barre-agenda">'
      + '<span class="jourdit">' + (cestAujourdhui ? "Aujourd\'hui"
          : dj.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"})) + "</span>"
      + boutonFleche(-1) + (cestAujourdhui ? "" : '<button class="mini" data-aujourdhui="1">Aujourd\'hui</button>') + boutonFleche(1)
      + "</div>";
    const blocs = repartir(blocsDe(jour0));
    corps += '<div class="agenda"><div class="piste-jour" style="--h-piste:' + (ETENDUE / 60 * HAUTEUR_H) + 'px">'
      + pisteHeures()
      + '<div class="colonnes" style="grid-template-columns:1fr">' + trames()
      + '<div class="col" data-poser="' + jour0 + '">' + blocs.map(b => unBloc(b, false)).join("")
      + traitMaintenant(jour0) + "</div></div></div>";
    corps += sansHeure(jour0) + "</div>";
  }else{
    const l = lundiDe(jour0);
    const sept = [];
    for(let i = 0; i < 7; i++){ const d2 = dt(l); d2.setDate(d2.getDate() + i); sept.push(iso(d2)); }
    corps += '<div class="barre-agenda">'
      + '<span class="jourdit">' + dt(l).toLocaleDateString("fr-FR", {day: "numeric", month: "long"})
      + " – " + dt(sept[6]).toLocaleDateString("fr-FR", {day: "numeric", month: "long"}) + "</span>"
      + boutonFleche(-7) + boutonFleche(7) + "</div>";
    corps += '<div class="agenda"><div class="jours-tete"><span></span><span class="cases" style="grid-template-columns:repeat(7,1fr)">'
      + sept.map(j => '<b class="' + (j === auj() ? "ici" : "") + '">'
          + dt(j).toLocaleDateString("fr-FR", {weekday: "short"}).replace(".", "") + " " + dt(j).getDate() + "</b>").join("")
      + "</span></div>"
      + '<div class="piste-jour" style="--h-piste:' + (ETENDUE / 60 * HAUTEUR_H) + 'px">'
      + pisteHeures()
      + '<div class="colonnes" style="grid-template-columns:repeat(7,1fr)">' + trames()
      + sept.map(j => '<div class="col" data-poser="' + j + '">'
          + blocsDe(j).map(b => unBloc(b, true)).join("") + traitMaintenant(j) + "</div>").join("")
      + "</div></div></div>";
  }

  let out = '<section class="heros anim">' + tete + bandeau + '<div class="liste-jour">' + corps + "</div></section>";
  out += pointSemaine();
  out += demo();
  return out;
}

function boutonFleche(pas){
  const d = pas < 0 ? '<path d="M14.5 5.5 8 12l6.5 6.5"/>' : '<path d="M9.5 5.5 16 12l-6.5 6.5"/>';
  return '<button class="fleche" data-pas="' + pas + '" aria-label="' + (pas < 0 ? "Précédent" : "Suivant") + '">'
    + '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + d + "</svg></button>";
}

/* les choses du jour qui n'ont pas d'heure restent en liste, sous la piste */
function sansHeure(isoJour){
  const sans = tachesDu(isoJour).filter(t => !t.heure && !t.fait);
  const auto = isoJour === auj() ? relancesAuto() : [];
  const tout = auto.concat(sans);
  if(!tout.length && isoJour !== auj()) return "";
  return (tout.length ? '<p class="groupe"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M4 7h16M4 12h16M4 17h10"/></svg>Sans heure<span class="nb">' + tout.length + " chose" + (tout.length > 1 ? "s" : "") + "</span></p>"
      + listeTaches(tout, "aujourdhui") : "")
    + (isoJour === auj() ? ligneVite() : "");
}

/* la vue Liste : celle d'avant, intacte */
function listeClassique(c){
  const tout = liste("taches").sort((x, y) => (x.fait - y.fait) || String(x.echeance).localeCompare(String(y.echeance)));
  const vis = filtreT === "faites" ? tout.filter(t => !!t.fait)
                                   : relancesAuto().concat(tout.filter(t => !t.fait));
  const libs = [["afaire", "À faire"], ["faites", "Terminées"]];
  let corps = '<div class="segments" style="margin-top:4px">' + libs.map(kv =>
    '<button data-ft="' + kv[0] + '" aria-pressed="' + (filtreT === kv[0]) + '">' + kv[1] + "</button>").join("") + "</div>";
  if(!vis.length){
    return corps + '<p class="vide"><b>' + (filtreT === "faites" ? "Rien de terminé" : "Rien à faire") + "</b>"
      + (filtreT === "faites" ? "Cochez une tâche, elle viendra ici." : "Écrivez la première ci-dessous.") + "</p>"
      + (filtreT !== "faites" ? ligneVite() : "");
  }
  if(filtreT === "faites") return corps + listeTaches(vis, "fait");
  const ICO = {
    retard: '<circle cx="12" cy="12" r="9"/><path d="M12 7.4v5"/><circle cx="12" cy="16.4" r="1.15" fill="currentColor" stroke="none"/>',
    aujourdhui: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6V5M12 19v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.6 12H5M19 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>',
    plustard: '<circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3 1.9"/>'
  };
  const grp = [
    ["retard", "En retard", vis.filter(t => jours(t.echeance) < 0), true],
    ["aujourdhui", "Aujourd\'hui", vis.filter(t => jours(t.echeance) === 0), false],
    ["plustard", "Plus tard", vis.filter(t => jours(t.echeance) > 0), false]
  ];
  const bande = g => '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'
    + ICO[g[0]] + "</svg>" + g[1] + '<span class="nb">' + g[2].length + " chose" + (g[2].length > 1 ? "s" : "") + "</span>";
  corps += grp.filter(g => g[2].length).map(g =>
    g[0] === "plustard"
      ? '<details class="pli"' + (pliOuvert ? " open" : "") + '><summary class="groupe">' + bande(g)
        + '<span class="chev"></span></summary>' + listeTaches(g[2], g[0]) + "</details>"
      : '<p class="groupe' + (g[3] ? " chaud" : "") + '">' + bande(g) + "</p>" + listeTaches(g[2], g[0])
  ).join("");
  return corps + ligneVite();
}

function pointSemaine(){
  const rf = ritFaits();
  return '<section class="carte anim" style="animation-delay:.12s"><details' + (rf.length ? " open" : "") + '>'
    + '<summary class="carte-tete" style="cursor:pointer"><h2>Le point de fin de semaine</h2>'
    + '<span class="appoint">' + rf.length + "/" + RITUEL.length + "</span></summary>"
    + '<p style="padding:0 24px;font-size:15px;color:var(--ink-2)">Cinq minutes le vendredi, et la semaine suivante est plus calme.</p>'
    + '<ol class="rituel">' + RITUEL.map((r, i) =>
        '<li><label><span class="n">' + (i + 1) + '</span><input type="checkbox" class="coche" data-rituel="' + i + '"'
        + (rf.indexOf(i) > -1 ? " checked" : "") + '><span class="txt">' + h(r) + "</span></label></li>").join("")
    + "</ol></details></section>";
}

function fiche(c){
  const e = ETIQ_C[c.statut] || ETIQ_C.prospect;
  const fx = liste("factures").filter(f => f.client === c.nom && f.statut !== "brouillon")
                              .reduce((s, f) => s + (Number(f.montant) || 0), 0);
  const nb = (c.notes || []).length;
  return '<article class="fiche" data-client="' + h(c.id) + '"><h3>' + h(c.nom) + "</h3>"
    + '<p class="projet">' + h(c.projet || "—") + "</p>"
    + '<div class="fiche-pied"><span class="chiffres">' + eur(fx) + "<small>facturé"
    + (nb ? " · " + nb + " note" + (nb > 1 ? "s" : "") : "") + "</small></span>"
    + '<button class="etat-btn ' + e[1] + '" data-etat="' + h(c.id) + '" title="Appuyez pour changer">' + e[0] + "</button>"
    + '<button class="sup" data-sup="clients" data-id="' + h(c.id) + '"><span class="mot">Supprimer</span></button></div></article>';
}

                                   .sort((x, y) => String(y.emise).localeCompare(String(x.emise)));
  const paye = siennes.filter(f => statut(f) === "payee").reduce((t, f) => t + (Number(f.montant) || 0), 0);

  return '<button class="retour" data-retour="1">'

    + "Vos clients</button>"

    + '<section class="carte anim"><div class="tete-client"><h2>' + h(c.nom) + "</h2>"
    + '<button class="etat-btn ' + e[1] + '" data-etat="' + h(c.id) + '" title="Appuyez pour changer">' + e[0] + "</button>"
    + (c.projet ? "<p>" + h(c.projet) + "</p>" : "")
    + (c.contact ? '<p style="color:var(--ink-3);font-size:14px">' + h(c.contact) + "</p>" : "")

    + '<div class="paye"><p class="lab">Ce client vous a payé</p>'
    + '<p class="gros" data-compte="paye-' + h(c.id) + '" data-val="' + paye + '">' + eur(paye) + "</p>"
    + (attente ? '<p class="reste">Il reste <b>' + eur(attente) + "</b> à encaisser.</p>"
               : (paye ? '<p class="reste">Tout est réglé.</p>' : '<p class="reste">Aucune facture pour l\'instant.</p>'))
    + "</div>"
    + '<div class="action-client"><button data-facturer="' + h(c.nom) + '">Faire une facture</button></div></section>'

        + siennes.map(f => rangeeFacture(f, true)).join("") + '<div style="height:10px"></div></section>' : "")

      : '<p class="vide"><b>Rien de noté</b>Ce qui s\'est dit au téléphone, ce qu\'il faut penser à lui demander.</p>')
    + '<div class="ecrire"><textarea id="note-' + h(c.id) + '" rows="1" placeholder="Ce qu\'il a dit, ce qu\'il attend…" '
    + 'data-note-pour="' + h(c.id) + '" aria-label="Écrire une note"></textarea>'
    + '<button class="go" data-ajout-note="' + h(c.id) + '">Noter</button></div></section>'
    + demo();
}

function vueClients(){
  if(clientOuvert) return ficheClient(clientOuvert);
  const RANG = {actif: 0, prospect: 1, termine: 2};
  const rg = c => RANG[c.statut] === undefined ? 3 : RANG[c.statut];
  const cl = liste("clients").sort((x, y) => rg(x) - rg(y) || String(x.nom).localeCompare(String(y.nom), "fr"));
  const actifs = cl.filter(c => c.statut === "actif");
  return '<section class="carte anim"><div class="carte-tete"><h2>Vos clients</h2>'
    + '<span class="appoint">' + actifs.length + " chantier" + (actifs.length > 1 ? "s" : "") + " en cours</span></div>"
    + (cl.length ? '<div class="fiches">' + cl.map(fiche).join("") + "</div>"
       : '<p class="vide"><b>Aucun client</b>Commencez par celui que vous avez eu au téléphone aujourd\'hui.</p>')
    + "</section>" + demo();
}

/* ───────── vue : argent ───────── */
function rangeeFacture(f, chezLui){
  const st = statut(f), e = ETIQ_F[st], j = jours(f.echeance);
  const quand = st === "payee" ? "émise le " + jour(f.emise)
    : st === "retard" ? "à relancer depuis " + (-j) + " jour" + (j < -1 ? "s" : "")
    : "à payer le " + jour(f.echeance);
  const ico = {
    payee: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    retard: '<path d="M12 7v6.5"/><circle cx="12" cy="17" r="1.1" fill="currentColor"/>',
    envoyee: '<circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3 1.9"/>',
    brouillon: '<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/>'
  }[st];
  return '<div class="r"><span class="pastille ' + e[1] + '">'
    + '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + ico + "</svg></span>"
    + '<span class="r-corps" data-modif="facture" data-id="' + h(f.id) + '" role="button" tabindex="0">'
    + '<span class="r-titre">' + (chezLui ? h(f.ref || "Facture") : h(f.client)) + "</span>"
    + '<span class="r-meta">' + (chezLui ? "" : '<span class="ref">' + h(f.ref || "") + "</span>")
    + '<span class="etiq ' + e[1] + '">' + e[0] + "</span>"
    + (f.objet ? "<span>" + h(f.objet) + "</span>" : "")
    + "<span>" + quand + "</span></span></span>"
    + '<span class="r-som' + (st === "payee" ? " paye" : "") + '">' + eur(f.montant) + "</span>"
    + '<button class="pdf" data-pdf="' + h(f.id) + '" title="Télécharger la facture en PDF">'
    + '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M12 3.5v11"/><path d="m7.8 10.5 4.2 4.2 4.2-4.2"/><path d="M4.5 18.5h15"/></svg>PDF</button>'
    + (st === "payee"
        ? '<button class="mini" data-regle="' + h(f.id) + '" title="Appuyez pour changer">' + h(f.regle || "Virement") + "</button>"
        : '<button class="mini" data-paye="' + h(f.id) + '">Payée</button>')
    + '<button class="sup" data-sup="factures" data-id="' + h(f.id) + '"><span class="mot">Supprimer</span></button></div>';
}

                                  : tout.filter(f => statut(f) !== "payee");

  const d0 = new Date();
  const delta = c.caAvant > 0 ? Math.round((c.caIci - c.caAvant) / c.caAvant * 100) : null;

  let mois = '<section class="carte anim"><div class="mois" style="padding-top:22px">'
    + '<p class="heros-lab">Vous avez facturé en ' + MOIS_LONG[d0.getMonth()] + "</p>"
    + '<p class="heros-val" data-compte="ca" data-val="' + c.caIci + '">' + eur(c.caIci) + "</p>";

      + (delta >= 0 ? "+" : "") + delta + " % par rapport à " + MOIS_LONG[(d0.getMonth() + 11) % 12] + "</span>";
  }
  mois += "</div></section>";

  return mois
    + '<div class="duo anim" style="animation-delay:.06s"><div class="tuile vert"><span class="lab">Déjà encaissé</span>'
    + '<span class="val" data-compte="encaisse" data-val="' + c.encaisse + '">' + eur(c.encaisse) + "</span>"
    + '<span class="sous">factures réglées ce mois</span></div>'

    + '<span class="sous">' + (c.impayees.length
        ? "dont " + c.impayees.length + " à relancer"

    + '<span class="appoint">' + vis.length + " ligne" + (vis.length > 1 ? "s" : "") + "</span></div>"
    + '<div class="segments">' + libs.map(kv =>
        '<button data-ff="' + kv[0] + '" aria-pressed="' + (filtreF === kv[0]) + '">' + kv[1] + "</button>").join("") + "</div>"
    + (vis.length ? vis.map(rangeeFacture).join("")

    + '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;stroke-width:2.2;fill:none">'
    + '<circle cx="12" cy="8.4" r="3.6"/><path d="M4.8 20c0-3.6 3.2-5.8 7.2-5.8s7.2 2.2 7.2 5.8"/></svg></span>'
    + (state.moi.nom ? "Vos coordonnées — " + h(state.moi.nom) : "Vos coordonnées sur les factures")
    + "</button></section>"

    + demo();
}

}
function vueBudget(){

  const vide = surDep
    ? '<p class="vide"><b>Aucune dépense</b>Loyer, matières, essence : notez-les au fil de l\'eau.</p>'

  const ligne = (lab, val, cls) => '<div class="bl"><span>' + lab + '</span><b' + (cls ? ' class="' + cls + '"' : "")

  /* ce qui reste vraiment : encaissé, moins les cotisations, l'impôt et les sorties */

    + '<div class="mois" style="padding-top:2px">'
