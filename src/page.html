    + '<p class="heros-val' + (k.reste < 0 ? " negatif" : "") + '" data-compte="reste" data-val="' + k.reste + '">' + eur(k.reste) + "</p>"
    + '<div class="bilan">'
    + ligne("Encaissé", "+ " + eur(k.encaisse), "plus")
    + ligne("Cotisations sociales <em style=\'font-style:normal;color:var(--ink-3)\'>" + k.regle.cotis + " %</em>", "− " + eur(k.cotis))
    + (k.impot ? ligne("Impôt sur le revenu <em style=\'font-style:normal;color:var(--ink-3)\'>" + k.regle.liber + " %</em>", "− " + eur(k.impot)) : "")
    + ligne("Dépenses", "− " + eur(k.depenses))
    + ligne("Investissements", "− " + eur(k.invest))
    + "</div></div>";

  bilan += "</div>";

  /* les deux murs qu'on ne voit qu'une fois dedans */
  const carteSeuil = (titre, encaisse, seuil, part, apres) => {
    const pcs = Math.round(part * 100);
    const restant = seuil - encaisse;
    const cls = restant <= 0 ? " franchi" : (pcs >= 80 ? " chaud" : "");
    return '<div class="seuil' + cls + '"><span class="quoi-s">' + titre + "</span>"
      + '<span class="reste-s">' + (restant > 0 ? "encore " + eur(restant) : "franchi") + "</span>"
      + '<div class="piste-s"><i style="width:' + Math.min(100, pcs) + '%"></i></div>'
      + '<span class="sous-s">' + (restant > 0 ? apres : "Le seuil de " + eur(seuil) + " est dépassé.") + "</span></div>";
  };
  bilan += '<div class="seuils">'
    + carteSeuil("Avant de devoir facturer la TVA", k.encaisse, k.regle.tva, k.partTva,
        "Au-delà de " + eur(k.regle.tva) + ", vous ajoutez la TVA à vos prix.")
    + carteSeuil("Avant de sortir de la micro-entreprise", k.encaisse, k.regle.plafond, k.partPlafond,
        "Au-delà de " + eur(k.regle.plafond) + ", changement de régime.")
    + "</div></section>";

  /* ── ce qu'il faut facturer pour se verser ce qu'on vise ── */
  if(k.caNecessaire > 0){
    const pc = Math.round(k.partObjectif * 100);
    bilan += '<section class="carte anim" style="animation-delay:.04s"><div class="carte-tete"><h2>Votre prix plancher</h2>'
      + '<span class="appoint">' + eur(state.moi.objectif) + " par mois</span></div>"
      + '<div class="objectif"><div class="gros-prix"><b>' + eur(Math.ceil(k.prixJour)) + "</b><span>par jour facturé</span></div>"
      + '<p class="ou-en">En dessous, vous travaillez à perte une fois les cotisations et les frais payés. '
      + "Il vous faut <b>" + eur(Math.ceil(k.caNecessaire)) + "</b> sur l'année, sur " + k.jours + " jours facturés.</p>"
      + '<div class="piste-p" style="margin-top:16px"><i style="width:' + pc + '%"></i></div>'
      + '<p class="ou-en" style="margin-top:10px">'
      + (k.manque <= 0
          ? '<span class="atteint">Objectif atteint.</span> Tout ce qui rentre maintenant est en plus.'
          : "<b>" + pc + " %</b> du chemin. Il manque <b>" + eur(Math.ceil(k.manque)) + "</b> — environ <b>"
            + k.joursRestants + " jour" + (k.joursRestants > 1 ? "s" : "") + "</b> à facturer.")
      + "</p>";
    /* dépendance à un seul client */
    if(k.grosPart >= 0.5 && k.nbClients > 0){
      bilan += '<div class="risque">'
        + '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M12 3.5 21 19.5H3Z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg>'
        + Math.round(k.grosPart * 100) + " % de vos rentrées viennent de " + h(k.grosClient) + "."
        + (k.nbClients < 3 ? " Cherchez-en d'autres." : "") + "</div>";
    }
    bilan += "</div></section>";
  }

  if(!(state.moi && state.moi.nom)){
    bilan += '<button class="ajout-ligne" data-moi="1"><span class="rond" style="border-style:solid">'
      + '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;stroke-width:2.2;fill:none">'
      + '<circle cx="12" cy="8.4" r="3.6"/><path d="M4.8 20c0-3.6 3.2-5.8 7.2-5.8s7.2 2.2 7.2 5.8"/></svg></span>'
      + "Dites votre activité et ce que vous visez</button>";
  }

  return bilan
    + '<section class="carte anim" style="animation-delay:.06s"><div class="carte-tete"><h2>Ce qui sort</h2>'
    + '<span class="appoint">' + eur(surDep ? k.depenses : k.invest) + " cette année</span></div>"
    + '<div class="segments">' + libs.map(kv =>
        '<button data-fb="' + kv[0] + '" aria-pressed="' + (filtreB === kv[0]) + '">' + kv[1] + "</button>").join("") + "</div>"
    + (vis.length ? vis.map(o => rangeeSortie(o, surDep ? "depenses" : "investissements")).join("") : vide)
    + '<button class="ajout-ligne" data-feuille="' + (surDep ? "depense" : "investissement") + '"><span class="rond"></span>'
    + (surDep ? "Ajouter une dépense" : "Ajouter un investissement") + "</button></section>"

    + '<section class="carte anim" style="animation-delay:.1s"><div class="carte-tete"><h2>Livre des recettes</h2>'
    + '<span class="appoint">obligatoire</span></div>'
    + '<p style="padding:0 24px;font-size:14.5px;color:var(--ink-2)">La liste de tout ce que vos clients vous ont réglé sur '
    + k.an + ". L\'administration peut vous la demander à tout moment.</p>"
    + '<div class="action-client" style="padding:18px 24px 24px"><button data-recettes="1">Éditer le livre en PDF</button></div></section>'
    + demo();
}

/* ═══ ce que la micro-entreprise garde vraiment ═══
   Taux 2026 : cotisations sociales, versement libératoire de l'impôt,
   et plafond de chiffre d'affaires au-delà duquel le régime tombe. */
const REGIMES = {
  vente:    {nom: "Vente de marchandises", cotis: 12.3, liber: 1.0, plafond: 188700, tva: 85000},
  services: {nom: "Prestations de services", cotis: 21.2, liber: 1.7, plafond: 77700, tva: 37500},
  liberal:  {nom: "Profession libérale", cotis: 24.6, liber: 2.2, plafond: 77700, tva: 37500}
};
function reglesMoi(){ return REGIMES[(state.moi && state.moi.regime) || "services"] || REGIMES.services; }

function comptes(){
  const an = String(new Date().getFullYear());
  const cetteAnnee = o => String(o.date || o.emise || "").slice(0, 4) === an;
  const somme = arr => arr.reduce((t, o) => t + (Number(o.montant) || 0), 0);
  const fact = liste("factures");
  const r = reglesMoi();
  const encaisse = somme(fact.filter(f => statut(f) === "payee" && cetteAnnee(f)));
  const facture = somme(fact.filter(f => f.statut !== "brouillon" && cetteAnnee(f)));
  const depenses = somme(liste("depenses").filter(cetteAnnee));
  const invest = somme(liste("investissements").filter(cetteAnnee));
  const cotis = Math.round(encaisse * r.cotis) / 100;
  const impot = (state.moi && state.moi.liberatoire) ? Math.round(encaisse * r.liber) / 100 : 0;
  /* combien faut-il encaisser pour se verser ce qu'on vise ? */
  const vise = (Number(state.moi && state.moi.objectif) || 0) * 12;
  const jours = Math.max(1, Number(state.moi && state.moi.joursFactures) || 200);
  const taux = (r.cotis + ((state.moi && state.moi.liberatoire) ? r.liber : 0)) / 100;
  const besoin = vise + depenses + invest;
  const caNecessaire = vise > 0 && taux < 1 ? besoin / (1 - taux) : 0;
  const prixJour = caNecessaire > 0 ? caNecessaire / jours : 0;
  const manque = Math.max(0, caNecessaire - encaisse);

  /* quelle part du chiffre vient du plus gros client ? */
  const parClient = {};
  fact.filter(f => statut(f) === "payee" && cetteAnnee(f))
      .forEach(f => { parClient[f.client] = (parClient[f.client] || 0) + (Number(f.montant) || 0); });
  const noms = Object.keys(parClient);
  let gros = null;
  noms.forEach(nm => { if(!gros || parClient[nm] > parClient[gros]) gros = nm; });

  return {an: an, regle: r, encaisse: encaisse, facture: facture, depenses: depenses,
    invest: invest, cotis: cotis, impot: impot, jours: jours,
    reste: encaisse - cotis - impot - depenses - invest,
    partPlafond: r.plafond ? Math.min(1, encaisse / r.plafond) : 0,
    vise: vise, caNecessaire: caNecessaire, prixJour: prixJour, manque: manque,
    joursRestants: prixJour > 0 ? Math.ceil(manque / prixJour) : 0,
    partObjectif: caNecessaire > 0 ? Math.min(1, encaisse / caNecessaire) : 0,
    grosClient: gros, grosPart: gros && encaisse > 0 ? parClient[gros] / encaisse : 0,
    nbClients: noms.length,
    ceMois: fact.filter(f => statut(f) === "payee" && String(f.emise || "").slice(0, 7) === auj().slice(0, 7))
                .reduce((t, f) => t + (Number(f.montant) || 0), 0),
    partTva: r.tva ? Math.min(1, encaisse / r.tva) : 0};
}

/* ═══ la facture en PDF ═══ */
function euroTxt(v){
  /* l'espace fine insécable du format français sort de l'encodage PDF standard :
     on la remplace par une espace ordinaire, sinon le montant s'affiche en carrés */
  return new Intl.NumberFormat("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2})
    .format(Number(v) || 0).replace(/[\u202F\u00A0\u2009]/g, " ") + " EUR";
}
function dateTxt(iso){
  if(!iso) return "";
  const d = dt(iso);
  return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
}

function pdfFacture(f){
  if(!window.jspdf || !window.jspdf.jsPDF){ bulle("PDF indisponible ici"); return; }
  const moi = state.moi || {};
  const doc = new window.jspdf.jsPDF({unit: "mm", format: "a4"});
  const G = 20, D = 190;
  let y = 24;

  doc.setFont("helvetica", "bold").setFontSize(20).setTextColor(20, 32, 46);
  doc.text("FACTURE", G, y);
  doc.setFont("helvetica", "normal").setFontSize(10).setTextColor(110, 122, 140);
  doc.text(String(f.ref || ""), D, y, {align: "right"});
  doc.text("Émise le " + dateTxt(f.emise), D, y + 5.5, {align: "right"});

  y += 16;
  doc.setDrawColor(222, 231, 240).setLineWidth(0.4).line(G, y, D, y);
  y += 10;

  /* émetteur à gauche, client à droite */
  const bloc = (x, titre, lignes, align) => {
    let yy = y;
    doc.setFont("helvetica", "bold").setFontSize(8.5).setTextColor(130, 142, 160);
    doc.text(titre.toUpperCase(), x, yy, {align: align});
    yy += 6;
    doc.setFontSize(10.5).setTextColor(20, 32, 46);
    lignes.filter(Boolean).forEach((l, i) => {
      doc.setFont("helvetica", i === 0 ? "bold" : "normal");
      String(l).split("\n").forEach(part => {
        doc.text(part, x, yy, {align: align});
        yy += 5.2;
      });
    });
    return yy;
  };
  const gauche = bloc(G, "Émetteur", [moi.nom || "Votre entreprise", moi.adresse, moi.siret ? "SIRET " + moi.siret : "", moi.email], "left");
  const droite = bloc(D, "Facturé à", [f.client], "right");

  y = Math.max(gauche, droite) + 12;

  /* la prestation */
  doc.setFillColor(243, 247, 251).rect(G, y, D - G, 11, "F");
  doc.setFont("helvetica", "bold").setFontSize(9).setTextColor(90, 102, 120);
  doc.text("DÉSIGNATION", G + 4, y + 7);
  doc.text("MONTANT", D - 4, y + 7, {align: "right"});
  y += 18;
  doc.setFont("helvetica", "normal").setFontSize(11).setTextColor(20, 32, 46);
  const objet = f.objet || "Prestation";
  doc.splitTextToSize(objet, 120).forEach(l => { doc.text(l, G + 4, y); y += 5.6; });
  doc.text(euroTxt(f.montant), D - 4, y - 5.6, {align: "right"});

  y += 6;
  doc.setDrawColor(222, 231, 240).line(G, y, D, y);
  y += 9;

  /* totaux */
  const taux = Number(moi.tva) || 0;
  const ht = Number(f.montant) || 0;
  const tva = Math.round(ht * taux) / 100;
  const ligneTot = (lab, val, gras) => {
    doc.setFont("helvetica", gras ? "bold" : "normal").setFontSize(gras ? 13 : 10.5);
    doc.setTextColor(gras ? 20 : 110, gras ? 32 : 122, gras ? 46 : 140);
    doc.text(lab, D - 48, y, {align: "right"});
    doc.setTextColor(20, 32, 46);
    doc.text(val, D - 4, y, {align: "right"});
    y += gras ? 9 : 6.5;
  };
  if(taux > 0){
    ligneTot("Total HT", euroTxt(ht), false);
    ligneTot("TVA " + taux + " %", euroTxt(tva), false);
    ligneTot("Total TTC", euroTxt(ht + tva), true);
  }else{
    ligneTot("Total", euroTxt(ht), true);
  }

  y += 8;
  doc.setFont("helvetica", "normal").setFontSize(9.5).setTextColor(110, 122, 140);
  doc.text("À régler avant le " + dateTxt(f.echeance) + ".", G, y); y += 5.5;
  if(taux === 0){ doc.text("TVA non applicable, article 293 B du CGI.", G, y); y += 5.5; }
  doc.text("Pénalités de retard : 3 fois le taux d'intérêt légal. Indemnité forfaitaire pour frais de recouvrement : 40 EUR.", G, y, {maxWidth: D - G});

  return doc;
}

/* Le livre des recettes : ce que la loi exige d'un micro-entrepreneur —
   date, client, désignation, référence et montant, dans l'ordre chronologique. */
async function livreRecettes(){
  if(!window.jspdf || !window.jspdf.jsPDF){ bulle("PDF indisponible ici"); return; }
  const k = comptes();
  const moi = state.moi || {};
  const lignes = liste("factures")
    .filter(f => statut(f) === "payee" && String(f.emise || "").slice(0, 4) === k.an)
    .sort((a, b) => String(a.emise).localeCompare(String(b.emise)));

  const doc = new window.jspdf.jsPDF({unit: "mm", format: "a4"});
  const G = 18, D = 192;
  let y = 22;

  doc.setFont("helvetica", "bold").setFontSize(17).setTextColor(20, 32, 46);
  doc.text("LIVRE DES RECETTES " + k.an, G, y);
  y += 7;
  doc.setFont("helvetica", "normal").setFontSize(10).setTextColor(110, 122, 140);
  doc.text((moi.nom || "") + (moi.siret ? "  ·  SIRET " + moi.siret : ""), G, y);
  y += 10;

  function entete(){
    doc.setFillColor(243, 247, 251).rect(G, y, D - G, 9, "F");
    doc.setFont("helvetica", "bold").setFontSize(8.5).setTextColor(90, 102, 120);
    doc.text("DATE", G + 3, y + 6);
    doc.text("CLIENT", G + 26, y + 6);
    doc.text("DÉSIGNATION", G + 76, y + 6);
    doc.text("RÉGLÉ PAR", D - 62, y + 6);
    doc.text("RÉFÉRENCE", D - 30, y + 6, {align: "right"});
    doc.text("MONTANT", D - 3, y + 6, {align: "right"});
    y += 14;
    doc.setFont("helvetica", "normal").setFontSize(9.5).setTextColor(20, 32, 46);
  }
  entete();

  lignes.forEach(f => {
    if(y > 268){ doc.addPage(); y = 22; entete(); }
    doc.text(dateTxt(f.emise), G + 3, y);
    doc.text(doc.splitTextToSize(String(f.client || ""), 50)[0] || "", G + 26, y);
    doc.text(doc.splitTextToSize(String(f.objet || ""), 42)[0] || "", G + 76, y);
    doc.text(String(f.regle || "Virement"), D - 62, y);
    doc.text(String(f.ref || ""), D - 30, y, {align: "right"});
    doc.text(euroTxt(f.montant), D - 3, y, {align: "right"});
    y += 6.6;
  });

  if(!lignes.length){
    doc.setTextColor(130, 142, 160);
    doc.text("Aucune recette encaissée sur " + k.an + ".", G + 3, y);
    y += 7;
  }

  y += 3;
  doc.setDrawColor(200, 212, 226).setLineWidth(0.5).line(G, y, D, y);
  y += 9;
  doc.setFont("helvetica", "bold").setFontSize(12.5).setTextColor(20, 32, 46);
  doc.text("Total encaissé " + k.an, D - 48, y, {align: "right"});
  doc.text(euroTxt(k.encaisse), D - 3, y, {align: "right"});
  y += 11;
  doc.setFont("helvetica", "normal").setFontSize(9).setTextColor(110, 122, 140);
  doc.text("Édité le " + dateTxt(auj()) + " · " + lignes.length + " recette"
    + (lignes.length > 1 ? "s" : "") + " · " + k.regle.nom, G, y);

  const nom = "livre-des-recettes-" + k.an + ".pdf";
  if(window.claude && window.claude.use){
    const dl = await window.claude.use("downloads").catch(() => null);
    if(!dl){ bulle("Téléchargement indisponible ici"); return; }
    try{
      await dl.save({filename: nom, data: doc.output("arraybuffer")});
      bulle("Livre édité");
    }catch(e){ bulle(e && e.code === "declined" ? "Annulé" : "Téléchargement impossible"); }
    return;
  }
  doc.save(nom);
  bulle("Livre édité");
}

async function telechargerFacture(id){
  const brut = state.factures[id];
  if(!brut) return;
  if(!(state.moi && state.moi.nom)){
    bulle("Dites-nous qui vous êtes");
    ouvrir("moi", null, function(){ telechargerFacture(id); });
    return;
  }
  const f = Object.assign({id: id}, brut);
  const doc = pdfFacture(f);
  if(!doc) return;
  const nom = String(f.ref || "facture").replace(/[^A-Za-z0-9._-]/g, "-") + ".pdf";

  /* dans le visualiseur, seul le service de téléchargement peut livrer un fichier ;
     ouvert directement, le navigateur s'en charge lui-même */
  if(window.claude && window.claude.use){
    const dl = await window.claude.use("downloads").catch(() => null);
    if(!dl){ bulle("Téléchargement indisponible ici"); return; }
    try{
      await dl.save({filename: nom, data: doc.output("arraybuffer")});
      bulle("Facture téléchargée");
    }catch(e){
      const c = e && e.code;
      bulle(c === "declined" ? "Téléchargement annulé"
          : c === "rate_limited" ? "Réessayez dans un instant"
          : "Téléchargement impossible");
    }
    return;
  }
  doc.save(nom);
  bulle("Facture téléchargée");
}

/* ═══ emporter ses données ailleurs ═══ */
async function exporterTout(){
  const paquet = {application: "Cadence", version: 1, date: new Date().toISOString()};
  COLS.forEach(c => { paquet[c] = state[c]; });
  paquet.moi = state.moi;
  paquet.rituel = state.rituel;
  paquet.serie = state.serie;
  const texte = JSON.stringify(paquet, null, 1);
  const nom = "cadence-" + auj() + ".json";

  if(window.claude && window.claude.use){
    const dl = await window.claude.use("downloads").catch(() => null);
    if(!dl){ bulle("Enregistrement indisponible ici"); return; }
    try{
      await dl.save({filename: nom, data: texte});
      bulle("Copie enregistrée");
    }catch(e){
      bulle(e && e.code === "declined" ? "Enregistrement annulé" : "Enregistrement impossible");
    }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([texte], {type: "application/json"}));
  a.download = nom;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  bulle("Copie enregistrée");
}

function importerTout(){
  const ch = document.createElement("input");
  ch.type = "file";
  ch.accept = "application/json,.json";
  ch.addEventListener("change", () => {
    const fichier = ch.files && ch.files[0];
    if(!fichier) return;
    const lecteur = new FileReader();
    lecteur.onload = () => {
      let d = null;
      try{ d = JSON.parse(lecteur.result); }catch(e){}
      if(!d || typeof d !== "object" || d.application !== "Cadence"){
        bulle("Ce fichier n'est pas une copie de Cadence");
        return;
      }
      COLS.forEach(c => { state[c] = d[c] && typeof d[c] === "object" ? d[c] : {}; });
      if(d.moi) state.moi = Object.assign({nom: "", adresse: "", siret: "", email: "", tva: 0, regime: "services", liberatoire: false, objectif: 0, joursFactures: 200}, d.moi);
      if(d.rituel) state.rituel = d.rituel;
      if(d.serie) state.serie = d.serie;
      clientOuvert = null;
      sauver(); memoire.clear(); animer = true; rendre();
      let total = 0;
      COLS.forEach(c => { total += Object.keys(state[c]).length; });
      bulle(total + " fiche" + (total > 1 ? "s" : "") + " restaurée" + (total > 1 ? "s" : ""));
    };
    lecteur.readAsText(fichier);
  });
  ch.click();
}

function badge(sel, n){ const e = $(sel); e.hidden = n === 0; e.textContent = n; }

function apres(){
  const j = $(".anneau .jauge");
  if(j){
    const C = 289.03, p = Number(j.dataset.p) || 0, cible = C * (1 - p);
    anneauP = p;
    if(reduit()) j.style.strokeDashoffset = cible;
    else requestAnimationFrame(() => requestAnimationFrame(() => { j.style.strokeDashoffset = cible; }));
  }
  const cibles = document.querySelectorAll("[data-compte]");
  for(let i = 0; i < cibles.length; i++){
    const el = cibles[i], cle = el.dataset.compte, fin = Number(el.dataset.val) || 0;
    const debut = memoire.has(cle) ? memoire.get(cle) : 0;
    memoire.set(cle, fin);
    if(reduit() || debut === fin) el.textContent = eur(fin);
    else compter(el, debut, fin);
  }
}
function compter(el, a, b){
  const t0 = performance.now(), duree = 850;
  function pas(t){
    const k = Math.min(1, (t - t0) / duree);
    el.textContent = eur(a + (b - a) * (1 - Math.pow(1 - k, 4)));
    if(k < 1) requestAnimationFrame(pas);
  }
  requestAnimationFrame(pas);
}

function confettis(){
  if(reduit()) return;
  const cv = $("#confettis"), ctx = cv.getContext("2d");
  const L = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  cv.hidden = false;
  const teintes = ["#FF5E2B", "#FF9060", "#00B87C", "#FFC06B", "#FFFFFF"];
  const p = [];
  for(let i = 0; i < 46; i++){
    p.push({x: L / 2 + (Math.random() - .5) * 120, y: H * .42,
      vx: (Math.random() - .5) * 13, vy: -Math.random() * 15 - 5,
      r: 3 + Math.random() * 4, a: Math.random() * 6.28, va: (Math.random() - .5) * .3,
      c: teintes[Math.floor(Math.random() * teintes.length)]});
  }
  let n = 0;
  function pas(){
    ctx.clearRect(0, 0, L, H);
    for(let i = 0; i < p.length; i++){
      const o = p[i];
      o.vy += .42; o.x += o.vx; o.y += o.vy; o.a += o.va;
      ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.a); ctx.fillStyle = o.c;
      ctx.fillRect(-o.r, -o.r * .5, o.r * 2, o.r); ctx.restore();
    }

/* ═══ déplacer et étirer un bloc, comme dans un agenda ═══ */
let glissait = false;
let prise = null;

function minutesDepuisY(colonne, y){
  const r = colonne.getBoundingClientRect();
  const part = Math.min(1, Math.max(0, (y - r.top) / r.height));
  return DEBUT_J + part * ETENDUE;
}
const arrondir = m => Math.round(m / 15) * 15;

$("#vue").addEventListener("pointerdown", e => {
  const etire = e.target.closest("[data-etirer]");
  const bloc = e.target.closest("[data-bloc]");
  if(!bloc) return;
  const colonne = bloc.closest("[data-poser]");
  if(!colonne) return;
  const t = state.taches[bloc.dataset.bloc];
  if(!t) return;

  e.preventDefault();
  bloc.setPointerCapture(e.pointerId);
  glissait = false;
  prise = {
    bloc: bloc, colonne: colonne, id: bloc.dataset.bloc,
    mode: etire ? "etirer" : "poser",
    debDepart: enMinutes(t.heure), dureeDepart: Number(t.duree) || DUREE_DEFAUT,
    yDepart: e.clientY, jourDepart: colonne.dataset.poser
  };
});

$("#vue").addEventListener("pointermove", e => {
  if(!prise) return;
  const dy = e.clientY - prise.yDepart;
  if(!glissait && Math.abs(dy) < 4) return;
  glissait = true;
  prise.bloc.classList.add("prend");

  const r = prise.colonne.getBoundingClientRect();
  const enMin = dy / r.height * ETENDUE;

  if(prise.mode === "poser"){
    let deb = arrondir(prise.debDepart + enMin);
    deb = Math.max(DEBUT_J, Math.min(FIN_J - prise.dureeDepart, deb));
    prise.debCourant = deb;
    prise.bloc.style.top = ((deb - DEBUT_J) / ETENDUE * 100).toFixed(2) + "%";
  }else{
    let duree = arrondir(prise.dureeDepart + enMin);
    duree = Math.max(15, Math.min(FIN_J - prise.debDepart, duree));
    prise.dureeCourante = duree;
    prise.bloc.style.height = Math.max(2.6, duree / ETENDUE * 100).toFixed(2) + "%";
  }
});

function lacher(){
  if(!prise) return;
  const p = prise;
  prise = null;
  p.bloc.classList.remove("prend");
  if(!glissait) return;
  const t = state.taches[p.id];
  if(t){
    const maj = Object.assign({}, t);
    if(p.mode === "poser" && p.debCourant !== undefined){
      const hh = Math.floor(p.debCourant / 60), mm = p.debCourant % 60;
      maj.heure = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    }
    if(p.mode === "etirer" && p.dureeCourante !== undefined) maj.duree = p.dureeCourante;
    ecrire("taches", p.id, maj);
    bulle(p.mode === "poser" ? "Déplacé à " + heureLisible(maj.heure) : "Durée ajustée");
  }
  setTimeout(() => { glissait = false; }, 60);
}
$("#vue").addEventListener("pointerup", lacher);
$("#vue").addEventListener("pointercancel", lacher);

    const suivant = ordre[(i + 1) % ordre.length];
    ecrire("factures", b.dataset.regle, Object.assign({}, f, {regle: suivant}));
    bulle("Réglé par " + suivant.toLowerCase());
    return;
  }
  if(b.dataset.sauver){ exporterTout(); return; }
  if(b.dataset.restaurer){
    if(!armer(b)) return;
    importerTout();
    return;
  }
  if(b.dataset.demo){
    if(!armer(b)) return;
    COLS.forEach(c => liste(c).filter(o => o.exemple).forEach(o => { delete state[c][o.id]; }));
    sauver(); memoire.clear(); rendre(); bulle("À vous de jouer");
    return;
  }
  if(b.dataset.sup){
    if(!armer(b)) return;
    if(b.dataset.sup === "clients" && b.dataset.id === clientOuvert) clientOuvert = null;
    retirer(b.dataset.sup, b.dataset.id);
  }
});

$("#vue").addEventListener("toggle", e => {
  if(e.target.classList && e.target.classList.contains("pli")) pliOuvert = e.target.open;
}, true);

$("#vue").addEventListener("keydown", e => {
  if((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.modif){
    e.preventDefault(); modifier(e.target.dataset.modif, e.target.dataset.id); return;
  }
  if(e.key === "Enter" && e.target.id === "vite"){ e.preventDefault(); ajoutVite(); }
  if(e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.dataset.notePour){
    e.preventDefault(); noter(e.target.dataset.notePour);
  }
});

/* la zone de note grandit avec le texte */
$("#vue").addEventListener("input", e => {
  const z = e.target;
  if(!z.dataset.notePour) return;
  z.style.height = "auto";
  z.style.height = Math.min(180, z.scrollHeight) + "px";
});

$("#vue").addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.relance){
    const f = state.factures[t.dataset.relance];
    if(!f) return;
    ecrire("factures", t.dataset.relance, Object.assign({}, f, {relance: new Date().toISOString()}));
    bulle("Relance notée");
    return;
  }
  if(t.dataset.tache){
    const tache = state.taches[t.dataset.tache];
    if(!tache) return;
    const avant = calculs();
    state.taches[t.dataset.tache] = Object.assign({}, tache, {fait: t.checked});
    let mot = "";
    if(t.checked && majSerie()) mot = state.serie.n === 1 ? " · série lancée" : " · " + state.serie.n + " jours d'affilée";
    sauver(); rendre();
    if(t.checked){
      const apr = calculs();
      if(apr.duJour.length && !apr.resteJour.length && avant.resteJour.length){ confettis(); bulle("Journée bouclée" + mot); }
      else bulle("C'est fait" + mot);
    }
  }else if(t.dataset.rituel !== undefined){
    const sem = semaineIso(new Date());
    const f = {};
    ritFaits().forEach(i => { f[i] = true; });
    const i = Number(t.dataset.rituel);
    if(t.checked) f[i] = true; else delete f[i];
    const faits = Object.keys(f).map(Number).sort((a, b) => a - b);
    state.rituel = {semaine: sem, faits: faits};
    sauver(); rendre();
    if(faits.length === RITUEL.length) bulle("Semaine au propre");
  }
});

$("#feuille").addEventListener("click", e => {
  if(e.target.closest("#x")){ fermer(); return; }
  const t = e.target.closest("[data-type]");
  if(t) ouvrir(t.dataset.type);
});
$("#feuille").addEventListener("change", e => {
  if(e.target.name !== "quand") return;
  const d = $("#feuille .date-libre");
  if(!d) return;
  d.hidden = e.target.value !== "x";
  if(!d.hidden) d.focus();
});
$("#voile").addEventListener("click", fermer);
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#feuille").hidden) fermer(); });

$("#feuille").addEventListener("submit", e => {
  e.preventDefault();
  const d = {}, fd = new FormData(e.target);
  fd.forEach((v, k) => { d[k] = v; });
  /* modifier une fiche, c'est réécrire la même : on garde ce que le formulaire ne montre pas */
  const id = enModif || neuf();
  const col = COL_TYPE[typeActif];
  const garder = (enModif && col && state[col][enModif]) ? Object.assign({}, state[col][enModif]) : {};
  const mot = enModif ? "Modifié" : null;

  if(typeActif === "tache"){
    if(!String(d.titre || "").trim()) return;
    let ech = d.echeance || auj();
    if(d.quand && d.quand !== "x") ech = dans(Number(d.quand));
    const lu = lireHeure(String(d.titre).trim());
    ecrire("taches", id, Object.assign(garder, {titre: lu.titre,
      client: String(d.client || "").trim(), priorite: d.priorite || "normale",
      echeance: ech, heure: d.heure || lu.heure || "",
      duree: Number(d.duree) || garder.duree || DUREE_DEFAUT, fait: !!garder.fait}));
    bulle(mot || "Tâche ajoutée");
  }else if(typeActif === "client"){
    ecrire("clients", id, Object.assign(garder, {nom: String(d.nom).trim(),
      projet: String(d.projet || "").trim(), contact: String(d.contact || "").trim(),
      statut: d.statut || "actif"}));
    bulle(mot || "Client ajouté");
  }else if(typeActif === "facture"){
    ecrire("factures", id, Object.assign(garder, {
      ref: String(d.ref || "").trim() || refSuivante(), client: String(d.client).trim(),
      objet: String(d.objet || "").trim(), montant: Number(d.montant) || 0,
      emise: garder.emise || auj(), echeance: d.echeance || dans(30),
      statut: d.statut || "envoyee"}));
    const etaitModif = !!enModif;
    enModif = null;
    fermer();
    if(etaitModif) bulle("Modifié"); else telechargerFacture(id);
    return;
  }else if(typeActif === "moi"){
    state.moi = {nom: String(d.nom).trim(), adresse: String(d.adresse || "").trim(),
      siret: String(d.siret || "").trim(), email: String(d.email || "").trim(), tva: Number(d.tva) || 0,
      regime: d.regime || "services", liberatoire: !!d.liberatoire,
      objectif: Number(d.objectif) || 0, joursFactures: Number(d.joursFactures) || 200};
    sauver(); rendre();
    bulle("C'est enregistré");
    enModif = null;
    fermer();
    if(apresFeuille){ const suite = apresFeuille; apresFeuille = null; setTimeout(suite, 420); }
    return;
  }else if(typeActif === "depense" || typeActif === "investissement"){
    ecrire(col, id, Object.assign(garder, {libelle: String(d.libelle).trim(),
      montant: Number(d.montant) || 0, date: d.date || auj()}));
    bulle(mot || (typeActif === "depense" ? "Dépense notée" : "Investissement noté"));
  }
  enModif = null;
  fermer();
});

window.addEventListener("resize", () => {
  const c = $("#confettis");
  if(!c.hidden){ c.width = window.innerWidth; c.height = window.innerHeight; }
});

charger();
rendre();
</script>
